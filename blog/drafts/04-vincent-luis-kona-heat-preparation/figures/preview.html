<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog 04 figures</title><link rel="stylesheet" href="../../../../assets/fonts/fonts.css"><style>
.rp-fig{--ink:#15171A;--muted:#5B5F64;--line:#DDD9D0;--card:#FFFFFF;--pc:#B83C0B;--pc2:#FCE7DC;--heat:#B83C0B;--ref:#A4A9AE;
 position:relative;margin:32px 0;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.rp-fig *{box-sizing:border-box}
.rp-fig h4{margin:0;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:20px;line-height:1.25;letter-spacing:-0.01em}
.rp-fig .rp-sub{margin:4px 0 16px;font-size:14px;color:var(--muted)}
.rp-fig .rp-row{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:10px;align-items:center;margin:10px 0}
.rp-fig .rp-lab{font-size:14px;font-weight:600;line-height:1.25}
.rp-fig .rp-lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.rp-fig .rp-track{position:relative;height:24px}
.rp-fig .rp-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.rp-fig .rp-bar{position:absolute;top:2px;height:20px;border-radius:0 4px 4px 0}
.rp-fig .rp-val{position:absolute;top:2px;line-height:20px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--ink);white-space:nowrap;padding-left:8px}
.rp-fig .rp-val.rp-left{padding-left:0;padding-right:8px;transform:translateX(-100%);color:#FFFFFF}
.rp-fig .rp-axis{position:relative;height:18px;margin-left:calc(40% + 10px);border-top:1px solid var(--line);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted)}
.rp-fig .rp-axis span{position:absolute;top:3px;transform:translateX(-50%);white-space:nowrap}
.rp-fig .rp-axis span:last-child{transform:translateX(-100%)}
.rp-fig .rp-axl{margin:6px 0 0 calc(40% + 10px);font-size:12px;color:var(--muted)}
.rp-fig .rp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rp-fig .rp-card{background:var(--pc2);border-radius:10px;padding:14px 16px}
.rp-fig .rp-card b{display:block;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-0.02em;color:var(--pc)}
.rp-fig .rp-card span{display:block;margin-top:4px;font-size:14px;line-height:1.35;color:var(--ink)}
.rp-fig .rp-card small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.rp-fig figcaption{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--muted)}
.rp-fig figcaption a{color:var(--muted)}
.rp-fig .rp-sr{position:absolute;left:0;top:0;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.rp-fig .rp-steps{list-style:none;margin:0;padding:0;position:relative}
.rp-fig .rp-steps:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;border-left:2px solid var(--line)}
.rp-fig .rp-step{position:relative;padding:8px 10px 8px 30px;margin:4px 0;border-radius:10px}
.rp-fig .rp-step:before{content:"";position:absolute;left:2px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--pc)}
.rp-fig .rp-step.rp-in{background:var(--pc2)}
.rp-fig .rp-step.rp-in:before{background:var(--pc)}
.rp-fig .rp-step b{display:block;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:600;color:var(--pc);letter-spacing:0.02em}
.rp-fig .rp-step span{display:block;font-size:14px;line-height:1.35}
.rp-fig .rp-step small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.rp-fig .rp-tag{display:inline-block;margin:0 0 10px;padding:3px 10px;border-radius:999px;background:var(--pc2);font-size:12px;color:var(--pc);font-weight:600}
@media (max-width:480px){.rp-fig{padding:16px}.rp-fig h4{font-size:18px}.rp-fig .rp-row{grid-template-columns:132px 1fr}.rp-fig .rp-axis,.rp-fig .rp-axl{margin-left:142px}.rp-fig .rp-cards{grid-template-columns:1fr}.rp-fig .rp-card b{font-size:24px}}
</style><style>body{margin:0;background:#F4F2ED;font-family:Inter,sans-serif}main{max-width:720px;margin:0 auto;padding:24px 16px}h2{font-family:"Inter Display",Inter;margin:40px 0 0}</style></head><body><main><h2>EN</h2><figure class="rp-fig" aria-label="Kona 2026: a hot, humid day"><h4>Kona 2026: a hot, humid day</h4><p class="rp-sub">The result and the conditions he raced in</p><div class="rp-cards" aria-hidden="true"><div class="rp-card"><b>7:47:27</b><span>1st, IRONMAN World Championship, Oct 10, 2026</span><small>Official IRONMAN results</small></div><div class="rp-card"><b>88°F</b><span>high at Kona International Airport (PHKO)</span><small>Weather Underground daily history</small></div><div class="rp-card"><b>88%</b><span>humidity at 6:53 am, already 79°F</span><small>PHKO, not on the course</small></div><div class="rp-card"><b>79°F (26°C)</b><span>average water temperature</span><small>IRONMAN course page</small></div></div><div class="rp-sr"><table><caption>The result and the conditions he raced in</caption><thead><tr><th>Number</th><th>What it is</th><th>Source</th></tr></thead><tbody><tr><td>7:47:27</td><td>1st, IRONMAN World Championship, Oct 10, 2026</td><td>Official IRONMAN results</td></tr><tr><td>88°F</td><td>high at Kona International Airport (PHKO)</td><td>Weather Underground daily history</td></tr><tr><td>88%</td><td>humidity at 6:53 am, already 79°F</td><td>PHKO, not on the course</td></tr><tr><td>79°F (26°C)</td><td>average water temperature</td><td>IRONMAN course page</td></tr></tbody></table></div><figcaption>Sources: official IRONMAN results and course page; Weather Underground history for PHKO, Oct 10, 2026. The airport is not on the course. n = 1.</figcaption></figure><figure class="rp-fig" aria-label="His heat prep, in his words"><h4>His heat prep, in his words</h4><p class="rp-sub">Months and weeks before Kona (Oct 10, 2026)</p><span class="rp-tag">Shaded: inside our heat window, 6 to 2 weeks out</span><ol class="rp-steps" aria-hidden="true"><li class="rp-step"><b>JAN TO FEB</b><span>Passive heat: hot baths and sauna</span><small>All-In Triathlon</small></li><li class="rp-step"><b>BEFORE TEXAS, APRIL</b><span>Easy rides and runs in the heat; raced Texas partly for heat and humidity</span><small>All-In Triathlon; ProTriNews</small></li><li class="rp-step"><b>ABOUT 10 TO 12 WEEKS OUT</b><span>Altitude camp in Font-Romeu; heat chamber sessions at altitude</span><small>The Triathlon Hour</small></li><li class="rp-step rp-in"><b>4 WEEKS OUT</b><span>Skipped Nice for big weeks and heat prep</span><small>The Triathlon Hour</small></li><li class="rp-step rp-in"><b>3 WEEKS OUT</b><span>IRONMAN-pace sessions in a heat chamber at 32°C and 80% humidity</span><small>All-In Triathlon</small></li><li class="rp-step"><b>OCT 10</b><span>Race day: 88°F high at the airport</span><small>Weather Underground, PHKO</small></li></ol><div class="rp-sr"><table><caption>Months and weeks before Kona (Oct 10, 2026)</caption><thead><tr><th>When</th><th>What he did</th><th>Source</th></tr></thead><tbody><tr><td>JAN TO FEB</td><td>Passive heat: hot baths and sauna</td><td>All-In Triathlon</td></tr><tr><td>BEFORE TEXAS, APRIL</td><td>Easy rides and runs in the heat; raced Texas partly for heat and humidity</td><td>All-In Triathlon; ProTriNews</td></tr><tr><td>ABOUT 10 TO 12 WEEKS OUT</td><td>Altitude camp in Font-Romeu; heat chamber sessions at altitude</td><td>The Triathlon Hour</td></tr><tr><td>4 WEEKS OUT</td><td>Skipped Nice for big weeks and heat prep</td><td>The Triathlon Hour</td></tr><tr><td>3 WEEKS OUT</td><td>IRONMAN-pace sessions in a heat chamber at 32°C and 80% humidity</td><td>All-In Triathlon</td></tr><tr><td>OCT 10</td><td>Race day: 88°F high at the airport</td><td>Weather Underground, PHKO</td></tr></tbody></table></div><figcaption>Sources: <a href="https://youtu.be/TXpXTfYTn28">All-In Triathlon</a> (uploaded Oct 12, 2026; episode sponsored by Precision Fuel &amp; Hydration); <a href="https://youtu.be/6Mpl1odkY5g">ProTriNews</a> (recorded Oct 11, 2026); <a href="https://www.youtube.com/watch?v=uY61pcBHsyQ">The Triathlon Hour</a> (Oct 18, 2026). Self-reported, n = 1. Our heat window is a general guideline.</figcaption></figure><figure class="rp-fig" aria-label="His carbs are not a target"><h4>His carbs are not a target</h4><p class="rp-sub">Carbs per hour: what he said he took, and what the guidance says</p><div class="rp-row"><div class="rp-lab">Luis, bike<small>his estimate</small></div><div class="rp-track" title="Luis, bike: 145 g/h"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:96.67%;background:var(--pc)"></div><div class="rp-val rp-left" style="left:96.67%">145 g/h</div></div></div><div class="rp-row"><div class="rp-lab">Luis, run<small>his estimate</small></div><div class="rp-track" title="Luis, run: 100 g/h"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:66.67%;background:var(--pc)"></div><div class="rp-val rp-left" style="left:66.67%">100 g/h</div></div></div><div class="rp-row"><div class="rp-lab">Possible ceiling<small>trained athletes, review</small></div><div class="rp-track" title="Possible ceiling: 120 g/h"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:80.00%;background:var(--ref)"></div><div class="rp-val rp-left" style="left:80.00%">120 g/h</div></div></div><div class="rp-row"><div class="rp-lab">Guideline<small>efforts over 2.5 to 3 h, up to</small></div><div class="rp-track" title="Guideline: 90 g/h"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:60.00%;background:#1F2328"></div><div class="rp-val rp-left" style="left:60.00%">90 g/h</div></div></div><div class="rp-axis"><span style="left:0.00%">0</span><span style="left:33.33%">50</span><span style="left:66.67%">100</span><span style="left:100.00%">150</span></div><p class="rp-axl">Grams of carbs per hour</p><div class="rp-sr"><table><caption>Carbs per hour: what he said he took, and what the guidance says</caption><thead><tr><th>Who</th><th>Detail</th><th>g/h</th></tr></thead><tbody><tr><td>Luis, bike</td><td>his estimate</td><td>145</td></tr><tr><td>Luis, run</td><td>his estimate</td><td>100</td></tr><tr><td>Possible ceiling</td><td>trained athletes, review</td><td>120</td></tr><tr><td>Guideline</td><td>efforts over 2.5 to 3 h, up to</td><td>90</td></tr></tbody></table></div><figcaption>Sources: Luis on <a href="https://youtu.be/TXpXTfYTn28">All-In Triathlon</a> (his nutrition partner is 6d Sports Nutrition); <a href="https://doi.org/10.1016/j.tjnut.2026.101442">Morton et al. 2026</a> (review; several authors have ties to Science in Sport); <a href="https://pubmed.ncbi.nlm.nih.gov/26917108/">2016 position statement</a> (Academy of Nutrition and Dietetics, Dietitians of Canada, ACSM).</figcaption></figure><h2>ES</h2><figure class="rp-fig" aria-label="Kona 2026: un día caluroso y húmedo"><h4>Kona 2026: un día caluroso y húmedo</h4><p class="rp-sub">El resultado y las condiciones de la carrera</p><div class="rp-cards" aria-hidden="true"><div class="rp-card"><b>7:47:27</b><span>1.º, Campeonato Mundial IRONMAN, 10 de octubre de 2026</span><small>Resultados oficiales de IRONMAN</small></div><div class="rp-card"><b>88°F</b><span>máxima en el aeropuerto internacional de Kona (PHKO)</span><small>Historial de Weather Underground</small></div><div class="rp-card"><b>88%</b><span>de humedad a las 6:53 am, ya con 79°F</span><small>PHKO, fuera del recorrido</small></div><div class="rp-card"><b>79°F (26°C)</b><span>temperatura promedio del agua</span><small>Página oficial del recorrido</small></div></div><div class="rp-sr"><table><caption>El resultado y las condiciones de la carrera</caption><thead><tr><th>Número</th><th>Qué es</th><th>Fuente</th></tr></thead><tbody><tr><td>7:47:27</td><td>1.º, Campeonato Mundial IRONMAN, 10 de octubre de 2026</td><td>Resultados oficiales de IRONMAN</td></tr><tr><td>88°F</td><td>máxima en el aeropuerto internacional de Kona (PHKO)</td><td>Historial de Weather Underground</td></tr><tr><td>88%</td><td>de humedad a las 6:53 am, ya con 79°F</td><td>PHKO, fuera del recorrido</td></tr><tr><td>79°F (26°C)</td><td>temperatura promedio del agua</td><td>Página oficial del recorrido</td></tr></tbody></table></div><figcaption>Fuentes: resultados oficiales y página del recorrido de IRONMAN; historial de Weather Underground para PHKO, 10 de octubre de 2026. El aeropuerto no está en el recorrido. n = 1.</figcaption></figure><figure class="rp-fig" aria-label="Su preparación para el calor, según él"><h4>Su preparación para el calor, según él</h4><p class="rp-sub">Meses y semanas antes de Kona (10 de octubre de 2026)</p><span class="rp-tag">Sombreado: dentro de nuestra ventana de calor, 6 a 2 semanas antes</span><ol class="rp-steps" aria-hidden="true"><li class="rp-step"><b>ENERO A FEBRERO</b><span>Calor pasivo: baños calientes y sauna</span><small>All-In Triathlon</small></li><li class="rp-step"><b>ANTES DE TEXAS, ABRIL</b><span>Rodadas y trotes suaves con calor; corrió Texas en parte por el calor y la humedad</span><small>All-In Triathlon; ProTriNews</small></li><li class="rp-step"><b>UNAS 10 A 12 SEMANAS ANTES</b><span>Campamento en altura en Font-Romeu; sesiones en cámara de calor en altura</span><small>The Triathlon Hour</small></li><li class="rp-step rp-in"><b>4 SEMANAS ANTES</b><span>No corrió en Niza para hacer semanas grandes y preparar el calor</span><small>The Triathlon Hour</small></li><li class="rp-step rp-in"><b>3 SEMANAS ANTES</b><span>Sesiones a ritmo IRONMAN en cámara de calor a 32°C y 80% de humedad</span><small>All-In Triathlon</small></li><li class="rp-step"><b>10 DE OCTUBRE</b><span>Día de carrera: máxima de 88°F en el aeropuerto</span><small>Weather Underground, PHKO</small></li></ol><div class="rp-sr"><table><caption>Meses y semanas antes de Kona (10 de octubre de 2026)</caption><thead><tr><th>Cuándo</th><th>Qué hizo</th><th>Fuente</th></tr></thead><tbody><tr><td>ENERO A FEBRERO</td><td>Calor pasivo: baños calientes y sauna</td><td>All-In Triathlon</td></tr><tr><td>ANTES DE TEXAS, ABRIL</td><td>Rodadas y trotes suaves con calor; corrió Texas en parte por el calor y la humedad</td><td>All-In Triathlon; ProTriNews</td></tr><tr><td>UNAS 10 A 12 SEMANAS ANTES</td><td>Campamento en altura en Font-Romeu; sesiones en cámara de calor en altura</td><td>The Triathlon Hour</td></tr><tr><td>4 SEMANAS ANTES</td><td>No corrió en Niza para hacer semanas grandes y preparar el calor</td><td>The Triathlon Hour</td></tr><tr><td>3 SEMANAS ANTES</td><td>Sesiones a ritmo IRONMAN en cámara de calor a 32°C y 80% de humedad</td><td>All-In Triathlon</td></tr><tr><td>10 DE OCTUBRE</td><td>Día de carrera: máxima de 88°F en el aeropuerto</td><td>Weather Underground, PHKO</td></tr></tbody></table></div><figcaption>Fuentes: <a href="https://youtu.be/TXpXTfYTn28">All-In Triathlon</a> (publicado el 12 de octubre de 2026; episodio patrocinado por Precision Fuel &amp; Hydration); <a href="https://youtu.be/6Mpl1odkY5g">ProTriNews</a> (grabado el 11 de octubre de 2026); <a href="https://www.youtube.com/watch?v=uY61pcBHsyQ">The Triathlon Hour</a> (18 de octubre de 2026). Autorreportado, n = 1. Nuestra ventana de calor es una guía general.</figcaption></figure><figure class="rp-fig" aria-label="Sus carbohidratos no son una meta"><h4>Sus carbohidratos no son una meta</h4><p class="rp-sub">Carbohidratos por hora: lo que dijo que tomó y lo que dicen las guías</p><div class="rp-row"><div class="rp-lab">Luis, bici<small>su estimación</small></div><div class="rp-track" title="Luis, bici: 145 g/h"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:96.67%;background:var(--pc)"></div><div class="rp-val rp-left" style="left:96.67%">145 g/h</div></div></div><div class="rp-row"><div class="rp-lab">Luis, a pie<small>su estimación</small></div><div class="rp-track" title="Luis, a pie: 100 g/h"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:66.67%;background:var(--pc)"></div><div class="rp-val rp-left" style="left:66.67%">100 g/h</div></div></div><div class="rp-row"><div class="rp-lab">Techo posible<small>atletas entrenados, revisión</small></div><div class="rp-track" title="Techo posible: 120 g/h"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:80.00%;background:var(--ref)"></div><div class="rp-val rp-left" style="left:80.00%">120 g/h</div></div></div><div class="rp-row"><div class="rp-lab">Guía<small>esfuerzos de más de 2.5 a 3 h, hasta</small></div><div class="rp-track" title="Guía: 90 g/h"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:60.00%;background:#1F2328"></div><div class="rp-val rp-left" style="left:60.00%">90 g/h</div></div></div><div class="rp-axis"><span style="left:0.00%">0</span><span style="left:33.33%">50</span><span style="left:66.67%">100</span><span style="left:100.00%">150</span></div><p class="rp-axl">Gramos de carbohidratos por hora</p><div class="rp-sr"><table><caption>Carbohidratos por hora: lo que dijo que tomó y lo que dicen las guías</caption><thead><tr><th>Quién</th><th>Detalle</th><th>g/h</th></tr></thead><tbody><tr><td>Luis, bici</td><td>su estimación</td><td>145</td></tr><tr><td>Luis, a pie</td><td>su estimación</td><td>100</td></tr><tr><td>Techo posible</td><td>atletas entrenados, revisión</td><td>120</td></tr><tr><td>Guía</td><td>esfuerzos de más de 2.5 a 3 h, hasta</td><td>90</td></tr></tbody></table></div><figcaption>Fuentes: Luis en <a href="https://youtu.be/TXpXTfYTn28">All-In Triathlon</a> (su marca de nutrición es 6d Sports Nutrition); <a href="https://doi.org/10.1016/j.tjnut.2026.101442">Morton et al. 2026</a> (revisión; varios autores tienen vínculos con Science in Sport); <a href="https://pubmed.ncbi.nlm.nih.gov/26917108/">2016 position statement</a> (Academy of Nutrition and Dietetics, Dietitians of Canada, ACSM).</figcaption></figure></main></body></html>
