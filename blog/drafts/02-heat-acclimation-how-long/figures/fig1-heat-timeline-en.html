<style>
.rp-fig{--ink:#15171A;--muted:#5B5F64;--line:#DDD9D0;--card:#FFFFFF;--heat:#B83C0B;--heat2:#FCE7DC;--ref:#A4A9AE;
 position:relative;margin:32px 0;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.rp-fig *{box-sizing:border-box}
.rp-fig h4{margin:0;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:20px;line-height:1.25;letter-spacing:-0.01em}
.rp-fig .rp-sub{margin:4px 0 16px;font-size:14px;color:var(--muted)}
.rp-fig .rp-row{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:10px;align-items:center;margin:10px 0}
.rp-fig .rp-lab{font-size:14px;font-weight:600;line-height:1.25}
.rp-fig .rp-lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.rp-fig .rp-track{position:relative;height:24px}
.rp-fig .rp-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.rp-fig .rp-bar{position:absolute;top:2px;height:20px;border-radius:0 4px 4px 0}
.rp-fig .rp-bar.rp-range{border-radius:4px}
.rp-fig .rp-dot{position:absolute;top:5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--heat)}
.rp-fig .rp-val{position:absolute;top:2px;line-height:20px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--ink);white-space:nowrap;padding-left:10px}
.rp-fig .rp-val.rp-left{padding-left:0;padding-right:10px;transform:translateX(-100%)}
.rp-fig .rp-axis{position:relative;height:18px;margin-left:calc(40% + 10px);border-top:1px solid var(--line);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted)}
.rp-fig .rp-axis span{position:absolute;top:3px;transform:translateX(-50%);white-space:nowrap}
.rp-fig .rp-axl{margin:6px 0 0 calc(40% + 10px);font-size:12px;color:var(--muted)}
.rp-fig .rp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rp-fig .rp-card{background:var(--heat2);border-radius:10px;padding:14px 16px}
.rp-fig .rp-card b{display:block;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-0.02em;color:var(--heat)}
.rp-fig .rp-card span{display:block;margin-top:4px;font-size:14px;line-height:1.35;color:var(--ink)}
.rp-fig .rp-card small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.rp-fig figcaption{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--muted)}
.rp-fig figcaption a{color:var(--muted)}
.rp-fig .rp-sr{position:absolute;left:0;top:0;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
@media (max-width:480px){.rp-fig{padding:16px}.rp-fig h4{font-size:18px}.rp-fig .rp-row{grid-template-columns:132px 1fr}.rp-fig .rp-axis,.rp-fig .rp-axl{margin-left:142px}.rp-fig .rp-cards{grid-template-columns:1fr}.rp-fig .rp-card b{font-size:24px}}
</style>
<figure class="rp-fig" aria-label="The first heat changes come within days"><h4>The first heat changes come within days</h4><p class="rp-sub">When each change was measured, counted in days of heat training</p><div class="rp-row"><div class="rp-lab">Sweat sodium starts to fall<small>Klous 2020</small></div><div class="rp-track" title="Sweat sodium starts to fall: Day 3"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:18.75%"></div><div class="rp-grid" style="left:43.75%"></div><div class="rp-grid" style="left:62.50%"></div><div class="rp-grid" style="left:87.50%"></div><div class="rp-dot" style="left:18.75%"></div><div class="rp-val" style="left:18.75%">Day 3</div></div></div><div class="rp-row"><div class="rp-lab">Plasma volume peaks, +17.8%<small>Stanley 2015, sauna</small></div><div class="rp-track" title="Plasma volume peaks, +17.8%: 4 sessions"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:18.75%"></div><div class="rp-grid" style="left:43.75%"></div><div class="rp-grid" style="left:62.50%"></div><div class="rp-grid" style="left:87.50%"></div><div class="rp-dot" style="left:25.00%"></div><div class="rp-val" style="left:25.00%">4 sessions</div></div></div><div class="rp-row"><div class="rp-lab">Heart rate down 8 bpm, plasma volume up 7.3%<small>Snape 2026</small></div><div class="rp-track" title="Heart rate down 8 bpm, plasma volume up 7.3%: Day 5"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:18.75%"></div><div class="rp-grid" style="left:43.75%"></div><div class="rp-grid" style="left:62.50%"></div><div class="rp-grid" style="left:87.50%"></div><div class="rp-dot" style="left:31.25%"></div><div class="rp-val" style="left:31.25%">Day 5</div></div></div><div class="rp-row"><div class="rp-lab">5 km in 33°C, 4.9% faster<small>Zurawlew 2016, hot baths</small></div><div class="rp-track" title="5 km in 33°C, 4.9% faster: Day 6"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:18.75%"></div><div class="rp-grid" style="left:43.75%"></div><div class="rp-grid" style="left:62.50%"></div><div class="rp-grid" style="left:87.50%"></div><div class="rp-dot" style="left:37.50%"></div><div class="rp-val" style="left:37.50%">Day 6</div></div></div><div class="rp-row"><div class="rp-lab">Sweat rate starts to rise<small>Klous 2020</small></div><div class="rp-track" title="Sweat rate starts to rise: Day 7 to 8"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:18.75%"></div><div class="rp-grid" style="left:43.75%"></div><div class="rp-grid" style="left:62.50%"></div><div class="rp-grid" style="left:87.50%"></div><div class="rp-bar rp-range" style="left:43.75%;width:6.25%;background:var(--heat)"></div><div class="rp-val" style="left:50.00%">Day 7 to 8</div></div></div><div class="rp-row"><div class="rp-lab">Sweat rate +58% (arm), sodium about 60% of day 1<small>Klous 2020</small></div><div class="rp-track" title="Sweat rate +58% (arm), sodium about 60% of day 1: Day 10"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:18.75%"></div><div class="rp-grid" style="left:43.75%"></div><div class="rp-grid" style="left:62.50%"></div><div class="rp-grid" style="left:87.50%"></div><div class="rp-dot" style="left:62.50%"></div><div class="rp-val rp-left" style="left:62.50%">Day 10</div></div></div><div class="rp-row"><div class="rp-lab">Expert advice<small>Racinais 2015 · <span style="font-family:JetBrains Mono,ui-monospace,monospace">1 to 2 weeks</span></small></div><div class="rp-track" title="Expert advice: 1 to 2 weeks"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:18.75%"></div><div class="rp-grid" style="left:43.75%"></div><div class="rp-grid" style="left:62.50%"></div><div class="rp-grid" style="left:87.50%"></div><div class="rp-bar rp-range" style="left:43.75%;width:43.75%;background:var(--heat)"></div></div></div><div class="rp-row"><div class="rp-lab">Greatest adaptations<small>Tyler 2016, meta-analysis · <span style="font-family:JetBrains Mono,ui-monospace,monospace">Beyond 14 days</span></small></div><div class="rp-track" title="Greatest adaptations: Beyond 14 days"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:18.75%"></div><div class="rp-grid" style="left:43.75%"></div><div class="rp-grid" style="left:62.50%"></div><div class="rp-grid" style="left:87.50%"></div><div class="rp-bar rp-range" style="left:87.50%;width:12.50%;background:var(--heat)"></div></div></div><div class="rp-axis"><span style="left:0.00%">0</span><span style="left:18.75%">3</span><span style="left:43.75%">7</span><span style="left:62.50%">10</span><span style="left:87.50%">14</span></div><p class="rp-axl">Days of heat training</p><div class="rp-sr"><table><caption>When each change was measured, counted in days of heat training</caption><thead><tr><th>Change</th><th>Study</th><th>When</th></tr></thead><tbody><tr><td>Sweat sodium starts to fall</td><td>Klous 2020</td><td>Day 3</td></tr><tr><td>Plasma volume peaks, +17.8%</td><td>Stanley 2015, sauna</td><td>4 sessions</td></tr><tr><td>Heart rate down 8 bpm, plasma volume up 7.3%</td><td>Snape 2026</td><td>Day 5</td></tr><tr><td>5 km in 33°C, 4.9% faster</td><td>Zurawlew 2016, hot baths</td><td>Day 6</td></tr><tr><td>Sweat rate starts to rise</td><td>Klous 2020</td><td>Day 7 to 8</td></tr><tr><td>Sweat rate +58% (arm), sodium about 60% of day 1</td><td>Klous 2020</td><td>Day 10</td></tr><tr><td>Expert advice</td><td>Racinais 2015</td><td>1 to 2 weeks</td></tr><tr><td>Greatest adaptations</td><td>Tyler 2016, meta-analysis</td><td>Beyond 14 days</td></tr></tbody></table></div><figcaption>Sources: <a href="https://pubmed.ncbi.nlm.nih.gov/33077118/">Klous et al. 2020</a> (8 people, lab cycling, skin patches); <a href="https://pubmed.ncbi.nlm.nih.gov/25432420/">Stanley et al. 2015</a> (7 cyclists, no control group); <a href="https://doi.org/10.1371/journal.pone.0345346">Snape et al. 2026</a> (14 men, 7 per group); <a href="https://pubmed.ncbi.nlm.nih.gov/26661992/">Zurawlew et al. 2016</a> (17 men, 5 km lab test); <a href="https://pubmed.ncbi.nlm.nih.gov/25943653/">Racinais et al. 2015</a> (expert consensus); <a href="https://pubmed.ncbi.nlm.nih.gov/27106556/">Tyler et al. 2016</a> (meta-analysis of 96 articles).</figcaption></figure>
