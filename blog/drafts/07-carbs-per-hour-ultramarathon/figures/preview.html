<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog 07 figures</title><link rel="stylesheet" href="../../../../assets/fonts/fonts.css"><style>
.rp-fig{--ink:#15171A;--muted:#5B5F64;--line:#DDD9D0;--card:#FFFFFF;--gut:#1F5FAF;--gut2:#D6E2F1;--gutmid:#7FA3D6;--ref:#A4A9AE;
 position:relative;margin:32px 0;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.rp-fig *{box-sizing:border-box}
.rp-fig h4{margin:0;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:20px;line-height:1.25;letter-spacing:-0.01em}
.rp-fig .rp-sub{margin:4px 0 16px;font-size:14px;color:var(--muted)}
.rp-fig .rp-row{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:10px;align-items:center;margin:10px 0}
.rp-fig .rp-lab{font-size:14px;font-weight:600;line-height:1.25}
.rp-fig .rp-lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.rp-fig .rp-track{position:relative;height:24px}
.rp-fig .rp-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.rp-fig .rp-bar{position:absolute;top:2px;height:20px;border-radius:0 4px 4px 0}
.rp-fig .rp-bar.rp-range{border-radius:4px}
.rp-fig .rp-dot{position:absolute;top:5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--gut)}
.rp-fig .rp-val{position:absolute;top:2px;line-height:20px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--ink);white-space:nowrap;padding-left:10px}
.rp-fig .rp-val.rp-left{padding-left:0;padding-right:10px;transform:translateX(-100%)}
.rp-fig .rp-axis{position:relative;height:18px;margin-left:calc(40% + 10px);border-top:1px solid var(--line);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted)}
.rp-fig .rp-axis span{position:absolute;top:3px;transform:translateX(-50%);white-space:nowrap}
.rp-fig .rp-axl{margin:6px 0 0 calc(40% + 10px);font-size:12px;color:var(--muted)}
.rp-fig .rp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rp-fig .rp-card{background:var(--gut2);border-radius:10px;padding:14px 16px}
.rp-fig .rp-card b{display:block;white-space:nowrap;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-0.02em;color:var(--gut)}
.rp-fig .rp-card span{display:block;margin-top:4px;font-size:14px;line-height:1.35;color:var(--ink)}
.rp-fig .rp-card small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.rp-fig figcaption{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--muted)}
.rp-fig figcaption a{color:var(--muted)}
.rp-fig .rp-ci{position:absolute;top:11px;height:2px;background:var(--ink)}
.rp-fig .rp-ci:before,.rp-fig .rp-ci:after{content:'';position:absolute;top:-5px;width:2px;height:12px;background:var(--ink)}
.rp-fig .rp-ci:before{left:0}.rp-fig .rp-ci:after{right:0}
.rp-fig .rp-bar.rp-muted{background:var(--ref)}
.rp-fig .rp-zero{position:absolute;top:-4px;bottom:-4px;border-left:2px solid var(--muted)}
.rp-fig .rp-note{margin:8px 0 0;font-size:13px;font-weight:600;color:var(--ink)}
.rp-fig .rp-sr{position:absolute;left:0;top:0;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
@media (max-width:480px){.rp-fig{padding:16px}.rp-fig h4{font-size:18px}.rp-fig .rp-row{grid-template-columns:132px 1fr}.rp-fig .rp-axis,.rp-fig .rp-axl{margin-left:142px}.rp-fig .rp-cards{grid-template-columns:1fr}.rp-fig .rp-card b{font-size:24px}}
</style><style>body{margin:0;background:#F4F2ED;font-family:Inter,sans-serif}main{max-width:720px;margin:0 auto;padding:24px 16px}h2{font-family:"Inter Display",Inter;margin:40px 0 0}</style></head><body><main><h2>EN</h2><figure class="rp-fig" aria-label="More carbs, less muscle damage, same race time"><h4>More carbs, less muscle damage, same race time</h4><p class="rp-sub">Rise in a muscle damage marker (CK) from race day to 24 h later, by carbs per hour in a mountain marathon</p><div class="rp-row"><div class="rp-lab">60 g/h<small>6 runners</small></div><div class="rp-track" title="60 g/h: 976.2%"><div class="rp-grid" style="left:45.45%"></div><div class="rp-grid" style="left:90.91%"></div><div class="rp-bar" style="left:0;width:88.75%;background:var(--gutmid)"></div><div class="rp-val rp-left" style="left:88.75%;color:#15171A;font-weight:600">976.2%</div></div></div><div class="rp-row"><div class="rp-lab">90 g/h<small>7 runners</small></div><div class="rp-track" title="90 g/h: 963.4%"><div class="rp-grid" style="left:45.45%"></div><div class="rp-grid" style="left:90.91%"></div><div class="rp-bar" style="left:0;width:87.58%;background:var(--gutmid)"></div><div class="rp-val rp-left" style="left:87.58%;color:#15171A;font-weight:600">963.4%</div></div></div><div class="rp-row"><div class="rp-lab">120 g/h<small>7 runners</small></div><div class="rp-track" title="120 g/h: 155.9%"><div class="rp-grid" style="left:45.45%"></div><div class="rp-grid" style="left:90.91%"></div><div class="rp-bar" style="left:0;width:14.17%;background:var(--gut)"></div><div class="rp-val" style="left:14.17%">155.9%</div></div></div><div class="rp-axis"><span style="left:0.00%">0%</span><span style="left:45.45%">500%</span><span style="left:90.91%">1000%</span></div><p class="rp-axl">Rise in CK by the next day</p><p class="rp-note">Race time: no difference between groups (p = 0.871)</p><div class="rp-sr"><table><caption>Rise in a muscle damage marker (CK) from race day to 24 h later, by carbs per hour in a mountain marathon</caption><thead><tr><th>Carbs per hour</th><th>Runners analyzed</th><th>Rise in CK to 24 h</th></tr></thead><tbody><tr><td>60 g/h</td><td>6 runners</td><td>976.2%</td></tr><tr><td>90 g/h</td><td>7 runners</td><td>963.4%</td></tr><tr><td>120 g/h</td><td>7 runners</td><td>155.9%</td></tr></tbody></table></div><figcaption><a href="https://doi.org/10.3390/nu12051367">Viribay et al. 2020</a>. Randomized trial in a real mountain marathon, elite male trail runners, all gut trained, 2:1 maltodextrin to fructose gels. 6 of 26 starters did not finish, 3 for gut problems. Small groups, men only.</figcaption></figure><figure class="rp-fig" aria-label="Late power held better with more carbs"><h4>Late power held better with more carbs</h4><p class="rp-sub">Critical power after 3 h of cycling at a moderate intensity</p><div class="rp-row"><div class="rp-lab">Fresh<small>Before the ride</small></div><div class="rp-track" title="Fresh: 277 W"><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:92.33%;background:var(--ref)"></div><div class="rp-val rp-left" style="left:92.33%;color:#15171A;font-weight:600">277 W</div></div></div><div class="rp-row"><div class="rp-lab">Water<small>After 3 h</small></div><div class="rp-track" title="Water: 236 W"><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:78.67%;background:var(--ref)"></div><div class="rp-val rp-left" style="left:78.67%;color:#15171A;font-weight:600">236 W</div></div></div><div class="rp-row"><div class="rp-lab">60 g/h<small>After 3 h</small></div><div class="rp-track" title="60 g/h: 257 W"><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:85.67%;background:var(--gutmid)"></div><div class="rp-val rp-left" style="left:85.67%;color:#15171A;font-weight:600">257 W</div></div></div><div class="rp-row"><div class="rp-lab">120 g/h<small>After 3 h</small></div><div class="rp-track" title="120 g/h: 266 W"><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:88.67%;background:var(--gut)"></div><div class="rp-val rp-left" style="left:88.67%;color:#FFFFFF;font-weight:600">266 W</div></div></div><div class="rp-axis"><span style="left:0.00%">0</span><span style="left:33.33%">100</span><span style="left:66.67%">200</span><span style="left:100.00%">300</span></div><p class="rp-axl">Critical power (W)</p><div class="rp-sr"><table><caption>Critical power after 3 h of cycling at a moderate intensity</caption><thead><tr><th>Condition</th><th>When</th><th>Critical power</th></tr></thead><tbody><tr><td>Fresh</td><td>Before the ride</td><td>277 W</td></tr><tr><td>Water</td><td>After 3 h</td><td>236 W</td></tr><tr><td>60 g/h</td><td>After 3 h</td><td>257 W</td></tr><tr><td>120 g/h</td><td>After 3 h</td><td>266 W</td></tr></tbody></table></div><figcaption><a href="https://doi.org/10.1111/sms.70326">Norte et al. 2026</a>. Randomized crossover trial, 16 trained cyclists and triathletes (15 men, 1 woman), lab cycling after a full carb load. Race time not measured.</figcaption></figure><figure class="rp-fig" aria-label="At Western States, the gut decides who finishes"><h4>At Western States, the gut decides who finishes</h4><p class="rp-sub">What runners reported in two surveys at the Western States 100</p><div class="rp-cards" aria-hidden="true"><div class="rp-card"><b>96.0%</b><span>had at least one gut symptom, mostly mild</span><small>Stuempfle 2015 · 272 runners</small></div><div class="rp-card"><b>43.9%</b><span>of finishers said gut symptoms hurt their performance</span><small>Stuempfle 2015</small></div><div class="rp-card"><b>35.6%</b><span>of runners who dropped out named gut symptoms as one reason</span><small>Stuempfle 2015</small></div><div class="rp-card"><b>100% vs 69%</b><span>had a structured carb plan: under 18 h vs 24 to 30 h finishers</span><small>Mougin 2026 · 2025 race</small></div></div><div class="rp-sr"><table><caption>What runners reported in two surveys at the Western States 100</caption><thead><tr><th>Number</th><th>Finding</th><th>Source</th></tr></thead><tbody><tr><td>96.0%</td><td>had at least one gut symptom, mostly mild</td><td>Stuempfle 2015 · 272 runners</td></tr><tr><td>43.9%</td><td>of finishers said gut symptoms hurt their performance</td><td>Stuempfle 2015</td></tr><tr><td>35.6%</td><td>of runners who dropped out named gut symptoms as one reason</td><td>Stuempfle 2015</td></tr><tr><td>100% vs 69%</td><td>had a structured carb plan: under 18 h vs 24 to 30 h finishers</td><td>Mougin 2026 · 2025 race</td></tr></tbody></table></div><figcaption>Sources: <a href="https://doi.org/10.1080/02640414.2015.1012104">Stuempfle &amp; Hoffman 2015</a> (post-race questionnaire, 71.0% of starters); <a href="https://www.sciencedirect.com/science/article/pii/S1440244026002318">Mougin et al. 2026</a> (pre- and post-race surveys, 106 and 66 runners). Both self-reported, one race each: links, not proof.</figcaption></figure><h2>ES</h2><figure class="rp-fig" aria-label="Más carbohidratos, menos daño muscular, mismo tiempo"><h4>Más carbohidratos, menos daño muscular, mismo tiempo</h4><p class="rp-sub">Aumento de un marcador de daño muscular (CK) del día de la carrera a 24 h después, según los carbohidratos por hora en un maratón de montaña</p><div class="rp-row"><div class="rp-lab">60 g/h<small>6 corredores</small></div><div class="rp-track" title="60 g/h: 976.2%"><div class="rp-grid" style="left:45.45%"></div><div class="rp-grid" style="left:90.91%"></div><div class="rp-bar" style="left:0;width:88.75%;background:var(--gutmid)"></div><div class="rp-val rp-left" style="left:88.75%;color:#15171A;font-weight:600">976.2%</div></div></div><div class="rp-row"><div class="rp-lab">90 g/h<small>7 corredores</small></div><div class="rp-track" title="90 g/h: 963.4%"><div class="rp-grid" style="left:45.45%"></div><div class="rp-grid" style="left:90.91%"></div><div class="rp-bar" style="left:0;width:87.58%;background:var(--gutmid)"></div><div class="rp-val rp-left" style="left:87.58%;color:#15171A;font-weight:600">963.4%</div></div></div><div class="rp-row"><div class="rp-lab">120 g/h<small>7 corredores</small></div><div class="rp-track" title="120 g/h: 155.9%"><div class="rp-grid" style="left:45.45%"></div><div class="rp-grid" style="left:90.91%"></div><div class="rp-bar" style="left:0;width:14.17%;background:var(--gut)"></div><div class="rp-val" style="left:14.17%">155.9%</div></div></div><div class="rp-axis"><span style="left:0.00%">0%</span><span style="left:45.45%">500%</span><span style="left:90.91%">1000%</span></div><p class="rp-axl">Aumento de CK al día siguiente</p><p class="rp-note">Tiempo de carrera: sin diferencia entre grupos (p = 0.871)</p><div class="rp-sr"><table><caption>Aumento de un marcador de daño muscular (CK) del día de la carrera a 24 h después, según los carbohidratos por hora en un maratón de montaña</caption><thead><tr><th>Carbohidratos por hora</th><th>Corredores analizados</th><th>Aumento de CK a 24 h</th></tr></thead><tbody><tr><td>60 g/h</td><td>6 corredores</td><td>976.2%</td></tr><tr><td>90 g/h</td><td>7 corredores</td><td>963.4%</td></tr><tr><td>120 g/h</td><td>7 corredores</td><td>155.9%</td></tr></tbody></table></div><figcaption><a href="https://doi.org/10.3390/nu12051367">Viribay et al. 2020</a>. Ensayo aleatorizado en un maratón de montaña real, corredores de montaña hombres de élite, todos con el estómago entrenado, geles de maltodextrina y fructosa 2:1. 6 de 26 no terminaron, 3 por problemas digestivos. Grupos pequeños, solo hombres.</figcaption></figure><figure class="rp-fig" aria-label="Más carbohidratos, más potencia al final"><h4>Más carbohidratos, más potencia al final</h4><p class="rp-sub">Potencia crítica después de 3 h de ciclismo a intensidad moderada</p><div class="rp-row"><div class="rp-lab">Sin fatiga<small>Antes de pedalear</small></div><div class="rp-track" title="Sin fatiga: 277 W"><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:92.33%;background:var(--ref)"></div><div class="rp-val rp-left" style="left:92.33%;color:#15171A;font-weight:600">277 W</div></div></div><div class="rp-row"><div class="rp-lab">Agua<small>Tras 3 h</small></div><div class="rp-track" title="Agua: 236 W"><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:78.67%;background:var(--ref)"></div><div class="rp-val rp-left" style="left:78.67%;color:#15171A;font-weight:600">236 W</div></div></div><div class="rp-row"><div class="rp-lab">60 g/h<small>Tras 3 h</small></div><div class="rp-track" title="60 g/h: 257 W"><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:85.67%;background:var(--gutmid)"></div><div class="rp-val rp-left" style="left:85.67%;color:#15171A;font-weight:600">257 W</div></div></div><div class="rp-row"><div class="rp-lab">120 g/h<small>Tras 3 h</small></div><div class="rp-track" title="120 g/h: 266 W"><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:88.67%;background:var(--gut)"></div><div class="rp-val rp-left" style="left:88.67%;color:#FFFFFF;font-weight:600">266 W</div></div></div><div class="rp-axis"><span style="left:0.00%">0</span><span style="left:33.33%">100</span><span style="left:66.67%">200</span><span style="left:100.00%">300</span></div><p class="rp-axl">Potencia crítica (W)</p><div class="rp-sr"><table><caption>Potencia crítica después de 3 h de ciclismo a intensidad moderada</caption><thead><tr><th>Condición</th><th>Momento</th><th>Potencia crítica</th></tr></thead><tbody><tr><td>Sin fatiga</td><td>Antes de pedalear</td><td>277 W</td></tr><tr><td>Agua</td><td>Tras 3 h</td><td>236 W</td></tr><tr><td>60 g/h</td><td>Tras 3 h</td><td>257 W</td></tr><tr><td>120 g/h</td><td>Tras 3 h</td><td>266 W</td></tr></tbody></table></div><figcaption><a href="https://doi.org/10.1111/sms.70326">Norte et al. 2026</a>. Ensayo cruzado aleatorizado, 16 ciclistas y triatletas entrenados (15 hombres, 1 mujer), ciclismo en laboratorio tras una carga completa de carbohidratos. No midió tiempo de carrera.</figcaption></figure><figure class="rp-fig" aria-label="En la Western States, el estómago decide quién termina"><h4>En la Western States, el estómago decide quién termina</h4><p class="rp-sub">Lo que reportaron los corredores en dos encuestas en la Western States 100</p><div class="rp-cards" aria-hidden="true"><div class="rp-card"><b>96.0%</b><span>tuvo al menos un síntoma digestivo, casi siempre leve</span><small>Stuempfle 2015 · 272 corredores</small></div><div class="rp-card"><b>43.9%</b><span>de quienes terminaron dijo que los síntomas digestivos afectaron su rendimiento</span><small>Stuempfle 2015</small></div><div class="rp-card"><b>35.6%</b><span>de quienes abandonaron nombró los síntomas digestivos como uno de los motivos</span><small>Stuempfle 2015</small></div><div class="rp-card"><b>100% vs 69%</b><span>tenía un plan de carbohidratos: menos de 18 h vs 24 a 30 h</span><small>Mougin 2026 · edición 2025</small></div></div><div class="rp-sr"><table><caption>Lo que reportaron los corredores en dos encuestas en la Western States 100</caption><thead><tr><th>Número</th><th>Hallazgo</th><th>Fuente</th></tr></thead><tbody><tr><td>96.0%</td><td>tuvo al menos un síntoma digestivo, casi siempre leve</td><td>Stuempfle 2015 · 272 corredores</td></tr><tr><td>43.9%</td><td>de quienes terminaron dijo que los síntomas digestivos afectaron su rendimiento</td><td>Stuempfle 2015</td></tr><tr><td>35.6%</td><td>de quienes abandonaron nombró los síntomas digestivos como uno de los motivos</td><td>Stuempfle 2015</td></tr><tr><td>100% vs 69%</td><td>tenía un plan de carbohidratos: menos de 18 h vs 24 a 30 h</td><td>Mougin 2026 · edición 2025</td></tr></tbody></table></div><figcaption>Fuentes: <a href="https://doi.org/10.1080/02640414.2015.1012104">Stuempfle &amp; Hoffman 2015</a> (cuestionario después de la carrera, 71.0% de los que salieron); <a href="https://www.sciencedirect.com/science/article/pii/S1440244026002318">Mougin et al. 2026</a> (encuestas antes y después de la carrera, 106 y 66 corredores). Ambas autorreportadas, una carrera cada una: asociaciones, no pruebas.</figcaption></figure></main></body></html>
