<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog 05 figures</title><link rel="stylesheet" href="../../../../assets/fonts/fonts.css"><style>
.rp-fig{--ink:#15171A;--muted:#5B5F64;--line:#DDD9D0;--card:#FFFFFF;--pc:#2E9FD8;--pc2:#E3F2FA;--heat:#B83C0B;--ref:#A4A9AE;
 position:relative;margin:32px 0;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.rp-fig *{box-sizing:border-box}
.rp-fig h4{margin:0;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:20px;line-height:1.25;letter-spacing:-0.01em}
.rp-fig .rp-sub{margin:4px 0 16px;font-size:14px;color:var(--muted)}
.rp-fig .rp-row{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:10px;align-items:center;margin:10px 0}
.rp-fig .rp-lab{font-size:14px;font-weight:600;line-height:1.25}
.rp-fig .rp-lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.rp-fig .rp-track{position:relative;height:24px}
.rp-fig .rp-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.rp-fig .rp-bar{position:absolute;top:2px;height:20px;border-radius:0 4px 4px 0}
.rp-fig .rp-val{position:absolute;top:2px;line-height:20px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--ink);white-space:nowrap;padding-left:8px}
.rp-fig .rp-val.rp-left{padding-left:0;padding-right:8px;transform:translateX(-100%);color:#FFFFFF}
.rp-fig .rp-axis{position:relative;height:18px;margin-left:calc(40% + 10px);border-top:1px solid var(--line);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted)}
.rp-fig .rp-axis span{position:absolute;top:3px;transform:translateX(-50%);white-space:nowrap}
.rp-fig .rp-axis span:last-child{transform:translateX(-100%)}
.rp-fig .rp-axl{margin:6px 0 0 calc(40% + 10px);font-size:12px;color:var(--muted)}
.rp-fig .rp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rp-fig .rp-card{background:var(--pc2);border-radius:10px;padding:14px 16px}
.rp-fig .rp-card b{display:block;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-0.02em;color:var(--pc)}
.rp-fig .rp-card span{display:block;margin-top:4px;font-size:14px;line-height:1.35;color:var(--ink)}
.rp-fig .rp-card small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.rp-fig .rp-wh{position:absolute;top:11px;height:2px;background:var(--ink)}
.rp-fig .rp-wh:before,.rp-fig .rp-wh:after{content:"";position:absolute;top:-5px;width:2px;height:12px;background:var(--ink)}
.rp-fig .rp-wh:before{left:0}.rp-fig .rp-wh:after{right:0}
.rp-fig .rp-refl{position:absolute;top:-4px;bottom:-4px;border-left:2px solid var(--ink)}
.rp-fig .rp-val{z-index:2}
.rp-fig .rp-bar,.rp-fig .rp-wh{z-index:1}
.rp-fig .rp-refl{z-index:0}
.rp-fig .rp-refl ~ .rp-val:not(.rp-left):not(.rp-in){background:var(--card);padding-right:10px;margin-left:2px}
.rp-fig .rp-val.rp-in{color:#FFFFFF}
.rp-fig .rp-card.rp-res{background:var(--pc)}.rp-fig .rp-card.rp-res b,.rp-fig .rp-card.rp-res span,.rp-fig .rp-card.rp-res small{color:#FFFFFF}
.rp-fig .rp-card b{color:#1B6F99}
.rp-fig figcaption{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--muted)}
.rp-fig figcaption a{color:var(--muted)}
.rp-fig .rp-sr{position:absolute;left:0;top:0;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
@media (max-width:480px){.rp-fig{padding:16px}.rp-fig h4{font-size:18px}.rp-fig .rp-row{grid-template-columns:132px 1fr}.rp-fig .rp-axis,.rp-fig .rp-axl{margin-left:142px}.rp-fig .rp-cards{grid-template-columns:1fr}.rp-fig .rp-card b{font-size:24px}}
</style><style>body{margin:0;background:#F4F2ED;font-family:Inter,sans-serif}main{max-width:720px;margin:0 auto;padding:24px 16px}h2{font-family:"Inter Display",Inter;margin:40px 0 0}</style></head><body><main><h2>EN</h2><figure class="rp-fig" aria-label="Your sweat rate from two weigh-ins"><h4>Your sweat rate from two weigh-ins</h4><p class="rp-sub">An example: a steady 1-hour run</p><div class="rp-cards" aria-hidden="true"><div class="rp-card"><b>70.0 kg</b><span>Weight before</span><small>154.3 lb</small></div><div class="rp-card"><b>68.9 kg</b><span>Weight after</span><small>151.9 lb. Lost 1.1 kg</small></div><div class="rp-card"><b>+ 0.4 L</b><span>What you drank</span><small>About 14 oz</small></div><div class="rp-card rp-res"><b>1.5 L/h</b><span>Your sweat rate: 1.1 + 0.4, over 1 hour</span><small>About 51 oz an hour</small></div></div><div class="rp-sr"><table><caption>An example: a steady 1-hour run</caption><thead><tr><th>Value</th><th>Step</th><th>Imperial</th></tr></thead><tbody><tr><td>70.0 kg</td><td>Weight before</td><td>154.3 lb</td></tr><tr><td>68.9 kg</td><td>Weight after</td><td>151.9 lb. Lost 1.1 kg</td></tr><tr><td>+ 0.4 L</td><td>What you drank</td><td>About 14 oz</td></tr><tr><td>1.5 L/h</td><td>Your sweat rate: 1.1 + 0.4, over 1 hour</td><td>About 51 oz an hour</td></tr></tbody></table></div><figcaption>Method: <a href="https://doi.org/10.1249/mss.0b013e31802ca597">Sawka et al. 2007</a>; <a href="https://doi.org/10.1007/s40279-017-0691-5">Baker 2017</a>. Example numbers are illustrative. 1 kg of weight lost counts as about 1 L of sweat (our conversion).</figcaption></figure><figure class="rp-fig" aria-label="Endurance athletes sweat about 1.3 L an hour, with a wide spread"><h4>Endurance athletes sweat about 1.3 L an hour, with a wide spread</h4><p class="rp-sub">Average whole-body sweat rate by sport. The line on the endurance bar shows ± 0.57 L/h.</p><div class="rp-row"><div class="rp-lab">Endurance<small>1.28 ± 0.57 L/h</small></div><div class="rp-track" title="Endurance: 1.28"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:64.00%;background:var(--pc)"></div><div class="rp-wh" style="left:35.50%;width:57.00%"></div><div class="rp-val rp-in" style="left:0.00%">1.28</div></div></div><div class="rp-row"><div class="rp-lab">American football</div><div class="rp-track" title="American football: 1.51"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:75.50%;background:var(--ref)"></div><div class="rp-val rp-left" style="left:75.50%">1.51</div></div></div><div class="rp-row"><div class="rp-lab">Basketball</div><div class="rp-track" title="Basketball: 0.95"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:47.50%;background:var(--ref)"></div><div class="rp-val" style="left:47.50%">0.95</div></div></div><div class="rp-row"><div class="rp-lab">Soccer</div><div class="rp-track" title="Soccer: 0.94"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:47.00%;background:var(--ref)"></div><div class="rp-val" style="left:47.00%">0.94</div></div></div><div class="rp-row"><div class="rp-lab">Baseball</div><div class="rp-track" title="Baseball: 0.83"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:41.50%;background:var(--ref)"></div><div class="rp-val" style="left:41.50%">0.83</div></div></div><div class="rp-axis"><span style="left:0.00%">0.0</span><span style="left:25.00%">0.5</span><span style="left:50.00%">1.0</span><span style="left:75.00%">1.5</span><span style="left:100.00%">2.0</span></div><p class="rp-axl">Liters per hour</p><div class="rp-sr"><table><caption>Average whole-body sweat rate by sport. The line on the endurance bar shows ± 0.57 L/h.</caption><thead><tr><th>Sport</th><th>Detail</th><th>Sweat rate (L/h)</th></tr></thead><tbody><tr><td>Endurance</td><td>1.28 ± 0.57 L/h</td><td>1.28</td></tr><tr><td>American football</td><td></td><td>1.51</td></tr><tr><td>Basketball</td><td></td><td>0.95</td></tr><tr><td>Soccer</td><td></td><td>0.94</td></tr><tr><td>Baseball</td><td></td><td>0.83</td></tr></tbody></table></div><figcaption>Source: <a href="https://doi.org/10.1080/02640414.2019.1633159">Barnes et al. 2019</a>. Testing data from 1,303 athletes, 2000 to 2017. Athletes who came in for testing, not a random sample. All authors work at the Gatorade Sports Science Institute (PepsiCo).</figcaption></figure><figure class="rp-fig" aria-label="After 10 days of heat, more sweat and less salt"><h4>After 10 days of heat, more sweat and less salt</h4><p class="rp-sub">Change by day 10 of heat training, as a share of day 1 (day 1 = 100%, dark line)</p><div class="rp-row"><div class="rp-lab">Sweat rate, arm<small>local patch</small></div><div class="rp-track" title="Sweat rate, arm: +58%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-refl" style="left:50.00%"></div><div class="rp-bar" style="left:0;width:79.00%;background:var(--pc)"></div><div class="rp-val rp-left" style="left:79.00%">+58%</div></div></div><div class="rp-row"><div class="rp-lab">Sweat rate, back<small>local patch</small></div><div class="rp-track" title="Sweat rate, back: +36%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-refl" style="left:50.00%"></div><div class="rp-bar" style="left:0;width:68.00%;background:var(--pc)"></div><div class="rp-val rp-left" style="left:68.00%">+36%</div></div></div><div class="rp-row"><div class="rp-lab">Sweat sodium</div><div class="rp-track" title="Sweat sodium: about 60%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-refl" style="left:50.00%"></div><div class="rp-bar" style="left:0;width:30.00%;background:var(--ref)"></div><div class="rp-val" style="left:30.00%">about 60%</div></div></div><div class="rp-axis"><span style="left:0.00%">0%</span><span style="left:25.00%"></span><span style="left:50.00%">100%</span><span style="left:75.00%"></span><span style="left:100.00%">200%</span></div><p class="rp-axl">Percent of day 1</p><div class="rp-sr"><table><caption>Change by day 10 of heat training, as a share of day 1 (day 1 = 100%, dark line)</caption><thead><tr><th>Measure</th><th>Detail</th><th>Day 10 vs day 1</th></tr></thead><tbody><tr><td>Sweat rate, arm</td><td>local patch</td><td>+58%</td></tr><tr><td>Sweat rate, back</td><td>local patch</td><td>+36%</td></tr><tr><td>Sweat sodium</td><td></td><td>about 60%</td></tr></tbody></table></div><figcaption>Source: <a href="https://doi.org/10.1016/j.jtherbio.2020.102697">Klous et al. 2020</a>. Lab study, 8 people, 10 days of cycling at 33°C (91°F) and 65% humidity. Local sweat patches, not whole-body weigh-ins.</figcaption></figure><h2>ES</h2><figure class="rp-fig" aria-label="Tu tasa de sudoración con dos pesajes"><h4>Tu tasa de sudoración con dos pesajes</h4><p class="rp-sub">Un ejemplo: 1 hora de carrera a ritmo constante</p><div class="rp-cards" aria-hidden="true"><div class="rp-card"><b>70.0 kg</b><span>Peso antes</span><small>154.3 lb</small></div><div class="rp-card"><b>68.9 kg</b><span>Peso después</span><small>151.9 lb. Perdiste 1.1 kg</small></div><div class="rp-card"><b>+ 0.4 L</b><span>Lo que tomaste</span><small>Unas 14 oz</small></div><div class="rp-card rp-res"><b>1.5 L/h</b><span>Tu tasa de sudoración: 1.1 + 0.4, en 1 hora</span><small>Unas 51 oz por hora</small></div></div><div class="rp-sr"><table><caption>Un ejemplo: 1 hora de carrera a ritmo constante</caption><thead><tr><th>Valor</th><th>Paso</th><th>Imperial</th></tr></thead><tbody><tr><td>70.0 kg</td><td>Peso antes</td><td>154.3 lb</td></tr><tr><td>68.9 kg</td><td>Peso después</td><td>151.9 lb. Perdiste 1.1 kg</td></tr><tr><td>+ 0.4 L</td><td>Lo que tomaste</td><td>Unas 14 oz</td></tr><tr><td>1.5 L/h</td><td>Tu tasa de sudoración: 1.1 + 0.4, en 1 hora</td><td>Unas 51 oz por hora</td></tr></tbody></table></div><figcaption>Método: <a href="https://doi.org/10.1249/mss.0b013e31802ca597">Sawka et al. 2007</a>; <a href="https://doi.org/10.1007/s40279-017-0691-5">Baker 2017</a>. Los números del ejemplo son ilustrativos. 1 kg de peso perdido cuenta como cerca de 1 L de sudor (conversión nuestra).</figcaption></figure><figure class="rp-fig" aria-label="Los atletas de resistencia sudan cerca de 1.3 L por hora, con mucha variación"><h4>Los atletas de resistencia sudan cerca de 1.3 L por hora, con mucha variación</h4><p class="rp-sub">Tasa de sudoración promedio de todo el cuerpo por deporte. La línea en la barra de resistencia muestra ± 0.57 L/h.</p><div class="rp-row"><div class="rp-lab">Resistencia<small>1.28 ± 0.57 L/h</small></div><div class="rp-track" title="Resistencia: 1.28"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:64.00%;background:var(--pc)"></div><div class="rp-wh" style="left:35.50%;width:57.00%"></div><div class="rp-val rp-in" style="left:0.00%">1.28</div></div></div><div class="rp-row"><div class="rp-lab">Fútbol americano</div><div class="rp-track" title="Fútbol americano: 1.51"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:75.50%;background:var(--ref)"></div><div class="rp-val rp-left" style="left:75.50%">1.51</div></div></div><div class="rp-row"><div class="rp-lab">Básquetbol</div><div class="rp-track" title="Básquetbol: 0.95"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:47.50%;background:var(--ref)"></div><div class="rp-val" style="left:47.50%">0.95</div></div></div><div class="rp-row"><div class="rp-lab">Fútbol</div><div class="rp-track" title="Fútbol: 0.94"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:47.00%;background:var(--ref)"></div><div class="rp-val" style="left:47.00%">0.94</div></div></div><div class="rp-row"><div class="rp-lab">Béisbol</div><div class="rp-track" title="Béisbol: 0.83"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:41.50%;background:var(--ref)"></div><div class="rp-val" style="left:41.50%">0.83</div></div></div><div class="rp-axis"><span style="left:0.00%">0.0</span><span style="left:25.00%">0.5</span><span style="left:50.00%">1.0</span><span style="left:75.00%">1.5</span><span style="left:100.00%">2.0</span></div><p class="rp-axl">Litros por hora</p><div class="rp-sr"><table><caption>Tasa de sudoración promedio de todo el cuerpo por deporte. La línea en la barra de resistencia muestra ± 0.57 L/h.</caption><thead><tr><th>Deporte</th><th>Detalle</th><th>Sudoración (L/h)</th></tr></thead><tbody><tr><td>Resistencia</td><td>1.28 ± 0.57 L/h</td><td>1.28</td></tr><tr><td>Fútbol americano</td><td></td><td>1.51</td></tr><tr><td>Básquetbol</td><td></td><td>0.95</td></tr><tr><td>Fútbol</td><td></td><td>0.94</td></tr><tr><td>Béisbol</td><td></td><td>0.83</td></tr></tbody></table></div><figcaption>Fuente: <a href="https://doi.org/10.1080/02640414.2019.1633159">Barnes et al. 2019</a>. Datos de pruebas de 1,303 atletas, 2000 a 2017. Atletas que fueron a hacerse la prueba, no una muestra al azar. Todos los autores trabajan en el Gatorade Sports Science Institute (PepsiCo).</figcaption></figure><figure class="rp-fig" aria-label="Tras 10 días de calor, más sudor y menos sal"><h4>Tras 10 días de calor, más sudor y menos sal</h4><p class="rp-sub">Cambio al día 10 de entrenamiento con calor, frente al día 1 (día 1 = 100%, línea oscura)</p><div class="rp-row"><div class="rp-lab">Sudoración, brazo<small>parche local</small></div><div class="rp-track" title="Sudoración, brazo: +58%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-refl" style="left:50.00%"></div><div class="rp-bar" style="left:0;width:79.00%;background:var(--pc)"></div><div class="rp-val rp-left" style="left:79.00%">+58%</div></div></div><div class="rp-row"><div class="rp-lab">Sudoración, espalda<small>parche local</small></div><div class="rp-track" title="Sudoración, espalda: +36%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-refl" style="left:50.00%"></div><div class="rp-bar" style="left:0;width:68.00%;background:var(--pc)"></div><div class="rp-val rp-left" style="left:68.00%">+36%</div></div></div><div class="rp-row"><div class="rp-lab">Sodio del sudor</div><div class="rp-track" title="Sodio del sudor: cerca del 60%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-refl" style="left:50.00%"></div><div class="rp-bar" style="left:0;width:30.00%;background:var(--ref)"></div><div class="rp-val" style="left:30.00%">cerca del 60%</div></div></div><div class="rp-axis"><span style="left:0.00%">0%</span><span style="left:25.00%"></span><span style="left:50.00%">100%</span><span style="left:75.00%"></span><span style="left:100.00%">200%</span></div><p class="rp-axl">Porcentaje del día 1</p><div class="rp-sr"><table><caption>Cambio al día 10 de entrenamiento con calor, frente al día 1 (día 1 = 100%, línea oscura)</caption><thead><tr><th>Medida</th><th>Detalle</th><th>Día 10 frente al día 1</th></tr></thead><tbody><tr><td>Sudoración, brazo</td><td>parche local</td><td>+58%</td></tr><tr><td>Sudoración, espalda</td><td>parche local</td><td>+36%</td></tr><tr><td>Sodio del sudor</td><td></td><td>cerca del 60%</td></tr></tbody></table></div><figcaption>Fuente: <a href="https://doi.org/10.1016/j.jtherbio.2020.102697">Klous et al. 2020</a>. Estudio de laboratorio, 8 personas, 10 días de bici a 33°C (91°F) y 65% de humedad. Parches locales de sudor, no el peso de todo el cuerpo.</figcaption></figure></main></body></html>
