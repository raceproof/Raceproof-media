<style>
.rp-fig{--ink:#15171A;--muted:#5B5F64;--line:#DDD9D0;--card:#FFFFFF;--pc:#2E9FD8;--pc2:#E3F2FA;--heat:#B83C0B;--ref:#A4A9AE;
 position:relative;margin:32px 0;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.rp-fig *{box-sizing:border-box}
.rp-fig h4{margin:0;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:20px;line-height:1.25;letter-spacing:-0.01em}
.rp-fig .rp-sub{margin:4px 0 16px;font-size:14px;color:var(--muted)}
.rp-fig .rp-row{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:10px;align-items:center;margin:10px 0}
.rp-fig .rp-lab{font-size:14px;font-weight:600;line-height:1.25}
.rp-fig .rp-lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.rp-fig .rp-track{position:relative;height:24px}
.rp-fig .rp-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.rp-fig .rp-bar{position:absolute;top:2px;height:20px;border-radius:0 4px 4px 0}
.rp-fig .rp-val{position:absolute;top:2px;line-height:20px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--ink);white-space:nowrap;padding-left:8px}
.rp-fig .rp-val.rp-left{padding-left:0;padding-right:8px;transform:translateX(-100%);color:#FFFFFF}
.rp-fig .rp-axis{position:relative;height:18px;margin-left:calc(40% + 10px);border-top:1px solid var(--line);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted)}
.rp-fig .rp-axis span{position:absolute;top:3px;transform:translateX(-50%);white-space:nowrap}
.rp-fig .rp-axis span:last-child{transform:translateX(-100%)}
.rp-fig .rp-axl{margin:6px 0 0 calc(40% + 10px);font-size:12px;color:var(--muted)}
.rp-fig .rp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rp-fig .rp-card{background:var(--pc2);border-radius:10px;padding:14px 16px}
.rp-fig .rp-card b{display:block;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-0.02em;color:var(--pc)}
.rp-fig .rp-card span{display:block;margin-top:4px;font-size:14px;line-height:1.35;color:var(--ink)}
.rp-fig .rp-card small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.rp-fig .rp-wh{position:absolute;top:11px;height:2px;background:var(--ink)}
.rp-fig .rp-wh:before,.rp-fig .rp-wh:after{content:"";position:absolute;top:-5px;width:2px;height:12px;background:var(--ink)}
.rp-fig .rp-wh:before{left:0}.rp-fig .rp-wh:after{right:0}
.rp-fig .rp-refl{position:absolute;top:-4px;bottom:-4px;border-left:2px solid var(--ink)}
.rp-fig .rp-val{z-index:2}
.rp-fig .rp-bar,.rp-fig .rp-wh{z-index:1}
.rp-fig .rp-refl{z-index:0}
.rp-fig .rp-refl ~ .rp-val:not(.rp-left):not(.rp-in){background:var(--card);padding-right:10px;margin-left:2px}
.rp-fig .rp-val.rp-in{color:#FFFFFF}
.rp-fig .rp-card.rp-res{background:var(--pc)}.rp-fig .rp-card.rp-res b,.rp-fig .rp-card.rp-res span,.rp-fig .rp-card.rp-res small{color:#FFFFFF}
.rp-fig .rp-card b{color:#1B6F99}
.rp-fig figcaption{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--muted)}
.rp-fig figcaption a{color:var(--muted)}
.rp-fig .rp-sr{position:absolute;left:0;top:0;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
@media (max-width:480px){.rp-fig{padding:16px}.rp-fig h4{font-size:18px}.rp-fig .rp-row{grid-template-columns:132px 1fr}.rp-fig .rp-axis,.rp-fig .rp-axl{margin-left:142px}.rp-fig .rp-cards{grid-template-columns:1fr}.rp-fig .rp-card b{font-size:24px}}
</style>
<figure class="rp-fig" aria-label="After 10 days of heat, more sweat and less salt"><h4>After 10 days of heat, more sweat and less salt</h4><p class="rp-sub">Change by day 10 of heat training, as a share of day 1 (day 1 = 100%, dark line)</p><div class="rp-row"><div class="rp-lab">Sweat rate, arm<small>local patch</small></div><div class="rp-track" title="Sweat rate, arm: +58%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-refl" style="left:50.00%"></div><div class="rp-bar" style="left:0;width:79.00%;background:var(--pc)"></div><div class="rp-val rp-left" style="left:79.00%">+58%</div></div></div><div class="rp-row"><div class="rp-lab">Sweat rate, back<small>local patch</small></div><div class="rp-track" title="Sweat rate, back: +36%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-refl" style="left:50.00%"></div><div class="rp-bar" style="left:0;width:68.00%;background:var(--pc)"></div><div class="rp-val rp-left" style="left:68.00%">+36%</div></div></div><div class="rp-row"><div class="rp-lab">Sweat sodium</div><div class="rp-track" title="Sweat sodium: about 60%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-refl" style="left:50.00%"></div><div class="rp-bar" style="left:0;width:30.00%;background:var(--ref)"></div><div class="rp-val" style="left:30.00%">about 60%</div></div></div><div class="rp-axis"><span style="left:0.00%">0%</span><span style="left:25.00%"></span><span style="left:50.00%">100%</span><span style="left:75.00%"></span><span style="left:100.00%">200%</span></div><p class="rp-axl">Percent of day 1</p><div class="rp-sr"><table><caption>Change by day 10 of heat training, as a share of day 1 (day 1 = 100%, dark line)</caption><thead><tr><th>Measure</th><th>Detail</th><th>Day 10 vs day 1</th></tr></thead><tbody><tr><td>Sweat rate, arm</td><td>local patch</td><td>+58%</td></tr><tr><td>Sweat rate, back</td><td>local patch</td><td>+36%</td></tr><tr><td>Sweat sodium</td><td></td><td>about 60%</td></tr></tbody></table></div><figcaption>Source: <a href="https://doi.org/10.1016/j.jtherbio.2020.102697">Klous et al. 2020</a>. Lab study, 8 people, 10 days of cycling at 33°C (91°F) and 65% humidity. Local sweat patches, not whole-body weigh-ins.</figcaption></figure>
