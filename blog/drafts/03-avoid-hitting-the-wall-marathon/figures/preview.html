<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog 03 figures</title><link rel="stylesheet" href="../../../../assets/fonts/fonts.css"><style>
.rp-fig{--ink:#15171A;--muted:#5B5F64;--line:#DDD9D0;--card:#FFFFFF;--pc:#008A6C;--pc2:#DCEFE9;--heat:#B83C0B;--ref:#A4A9AE;
 position:relative;margin:32px 0;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.rp-fig *{box-sizing:border-box}
.rp-fig h4{margin:0;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:20px;line-height:1.25;letter-spacing:-0.01em}
.rp-fig .rp-sub{margin:4px 0 16px;font-size:14px;color:var(--muted)}
.rp-fig .rp-row{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:10px;align-items:center;margin:10px 0}
.rp-fig .rp-lab{font-size:14px;font-weight:600;line-height:1.25}
.rp-fig .rp-lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.rp-fig .rp-track{position:relative;height:24px}
.rp-fig .rp-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.rp-fig .rp-bar{position:absolute;top:2px;height:20px;border-radius:0 4px 4px 0}
.rp-fig .rp-val{position:absolute;top:2px;line-height:20px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--ink);white-space:nowrap;padding-left:8px}
.rp-fig .rp-val.rp-left{padding-left:0;padding-right:8px;transform:translateX(-100%);color:#FFFFFF}
.rp-fig .rp-axis{position:relative;height:18px;margin-left:calc(40% + 10px);border-top:1px solid var(--line);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted)}
.rp-fig .rp-axis span{position:absolute;top:3px;transform:translateX(-50%);white-space:nowrap}
.rp-fig .rp-axis span:last-child{transform:translateX(-100%)}
.rp-fig .rp-axl{margin:6px 0 0 calc(40% + 10px);font-size:12px;color:var(--muted)}
.rp-fig .rp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rp-fig .rp-card{background:var(--pc2);border-radius:10px;padding:14px 16px}
.rp-fig .rp-card b{display:block;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-0.02em;color:var(--pc)}
.rp-fig .rp-card span{display:block;margin-top:4px;font-size:14px;line-height:1.35;color:var(--ink)}
.rp-fig .rp-card small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.rp-fig figcaption{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--muted)}
.rp-fig figcaption a{color:var(--muted)}
.rp-fig .rp-sr{position:absolute;left:0;top:0;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
@media (max-width:480px){.rp-fig{padding:16px}.rp-fig h4{font-size:18px}.rp-fig .rp-row{grid-template-columns:132px 1fr}.rp-fig .rp-axis,.rp-fig .rp-axl{margin-left:142px}.rp-fig .rp-cards{grid-template-columns:1fr}.rp-fig .rp-card b{font-size:24px}}
</style><style>body{margin:0;background:#F4F2ED;font-family:Inter,sans-serif}main{max-width:720px;margin:0 auto;padding:24px 16px}h2{font-family:"Inter Display",Inter;margin:40px 0 0}</style></head><body><main><h2>EN</h2><figure class="rp-fig" aria-label="The wall is common, and it costs about half an hour"><h4>The wall is common, and it costs about half an hour</h4><p class="rp-sub">Recreational marathoners in more than 4 million race records, men and women</p><div class="rp-cards" aria-hidden="true"><div class="rp-card"><b>28% / 17%</b><span>of men and of women hit the wall</span><small>Men / women</small></div><div class="rp-card"><b>Km 29.6 / 29.3</b><span>where it started, on average</span><small>Men / women</small></div><div class="rp-card"><b>10.72 / 9.61 km</b><span>how long it lasted</span><small>Men / women</small></div><div class="rp-card"><b>31.50 / 33.20 min</b><span>lost against a recent best</span><small>Men / women</small></div></div><div class="rp-sr"><table><caption>Recreational marathoners in more than 4 million race records, men and women</caption><thead><tr><th>Number (men / women)</th><th>Finding</th></tr></thead><tbody><tr><td>28% / 17%</td><td>of men and of women hit the wall</td></tr><tr><td>Km 29.6 / 29.3</td><td>where it started, on average</td></tr><tr><td>10.72 / 9.61 km</td><td>how long it lasted</td></tr><tr><td>31.50 / 33.20 min</td><td>lost against a recent best</td></tr></tbody></table></div><figcaption>Source: <a href="https://doi.org/10.1371/journal.pone.0251513">Smyth 2021</a>. Observational race data, 270 races. The wall here means slowing at least 25% for 5 km or more after km 20.</figcaption></figure><figure class="rp-fig" aria-label="Fast starts were linked to the wall"><h4>Fast starts were linked to the wall</h4><p class="rp-sub">Share of Boston finishers who hit the wall, by how they paced</p><div class="rp-row"><div class="rp-lab">Started more than 5% fast<small>vs their average pace</small></div><div class="rp-track" title="Started more than 5% fast: 26.6%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:26.60%;background:var(--heat)"></div><div class="rp-val" style="left:26.60%">26.6%</div></div></div><div class="rp-row"><div class="rp-lab">Started near average pace</div><div class="rp-track" title="Started near average pace: 1.5%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:1.50%;background:var(--pc)"></div><div class="rp-val" style="left:1.50%">1.5%</div></div></div><div class="rp-row"><div class="rp-lab">Even pacers<small>47.9% of runners</small></div><div class="rp-track" title="Even pacers: 0.2%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:0.60%;background:var(--pc)"></div><div class="rp-val" style="left:0.20%">0.2%</div></div></div><div class="rp-row"><div class="rp-lab">Variable pacers<small>pace swung up and down</small></div><div class="rp-track" title="Variable pacers: 85.4%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:85.40%;background:var(--heat)"></div><div class="rp-val rp-left" style="left:85.40%">85.4%</div></div></div><div class="rp-axis"><span style="left:0.00%">0%</span><span style="left:25.00%"></span><span style="left:50.00%">50%</span><span style="left:75.00%"></span><span style="left:100.00%">100%</span></div><div class="rp-sr"><table><caption>Share of Boston finishers who hit the wall, by how they paced</caption><thead><tr><th>Pacing</th><th>Detail</th><th>Hit the wall</th></tr></thead><tbody><tr><td>Started more than 5% fast</td><td>vs their average pace</td><td>26.6%</td></tr><tr><td>Started near average pace</td><td></td><td>1.5%</td></tr><tr><td>Even pacers</td><td>47.9% of runners</td><td>0.2%</td></tr><tr><td>Variable pacers</td><td>pace swung up and down</td><td>85.4%</td></tr></tbody></table></div><figcaption>Source: <a href="https://doi.org/10.1371/journal.pone.0352808">Dong &amp; Li 2026</a>. 78,912 Boston Marathon finishers, 2015 to 2017. Observational: a link, not proof. One net-downhill course, no weather data.</figcaption></figure><figure class="rp-fig" aria-label="More carbs, more power left after 3 hours"><h4>More carbs, more power left after 3 hours</h4><p class="rp-sub">Critical power after 3 h of cycling, by what riders took in</p><div class="rp-row"><div class="rp-lab">Fresh<small>before the ride</small></div><div class="rp-track" title="Fresh: 277 W"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:92.33%;background:var(--ref)"></div><div class="rp-val rp-left" style="left:92.33%">277 W</div></div></div><div class="rp-row"><div class="rp-lab">Water only<small>after 3 h</small></div><div class="rp-track" title="Water only: 236 W"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:78.67%;background:var(--heat)"></div><div class="rp-val rp-left" style="left:78.67%">236 W</div></div></div><div class="rp-row"><div class="rp-lab">60 g/h<small>after 3 h</small></div><div class="rp-track" title="60 g/h: 257 W"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:85.67%;background:var(--pc)"></div><div class="rp-val rp-left" style="left:85.67%">257 W</div></div></div><div class="rp-row"><div class="rp-lab">120 g/h<small>after 3 h</small></div><div class="rp-track" title="120 g/h: 266 W"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:88.67%;background:var(--pc)"></div><div class="rp-val rp-left" style="left:88.67%">266 W</div></div></div><div class="rp-axis"><span style="left:0.00%">0</span><span style="left:33.33%">100</span><span style="left:66.67%">200</span><span style="left:100.00%">300</span></div><p class="rp-axl">Watts</p><div class="rp-sr"><table><caption>Critical power after 3 h of cycling, by what riders took in</caption><thead><tr><th>Condition</th><th>When</th><th>Critical power</th></tr></thead><tbody><tr><td>Fresh</td><td>before the ride</td><td>277 W</td></tr><tr><td>Water only</td><td>after 3 h</td><td>236 W</td></tr><tr><td>60 g/h</td><td>after 3 h</td><td>257 W</td></tr><tr><td>120 g/h</td><td>after 3 h</td><td>266 W</td></tr></tbody></table></div><figcaption>Source: <a href="https://doi.org/10.1111/sms.70326">Norte et al. 2026</a>. Randomized crossover trial, 16 trained cyclists and triathletes (15 men). Lab cycling, no race time measured.</figcaption></figure><h2>ES</h2><figure class="rp-fig" aria-label="El muro es común y cuesta cerca de media hora"><h4>El muro es común y cuesta cerca de media hora</h4><p class="rp-sub">Maratonistas recreativos en más de 4 millones de resultados, hombres y mujeres</p><div class="rp-cards" aria-hidden="true"><div class="rp-card"><b>28% / 17%</b><span>de los hombres y de las mujeres chocó con el muro</span><small>Hombres / mujeres</small></div><div class="rp-card"><b>Km 29.6 / 29.3</b><span>dónde empezó, en promedio</span><small>Hombres / mujeres</small></div><div class="rp-card"><b>10.72 / 9.61 km</b><span>cuánto duró</span><small>Hombres / mujeres</small></div><div class="rp-card"><b>31.50 / 33.20 min</b><span>perdidos frente a su mejor marca reciente</span><small>Hombres / mujeres</small></div></div><div class="rp-sr"><table><caption>Maratonistas recreativos en más de 4 millones de resultados, hombres y mujeres</caption><thead><tr><th>Número (hombres / mujeres)</th><th>Hallazgo</th></tr></thead><tbody><tr><td>28% / 17%</td><td>de los hombres y de las mujeres chocó con el muro</td></tr><tr><td>Km 29.6 / 29.3</td><td>dónde empezó, en promedio</td></tr><tr><td>10.72 / 9.61 km</td><td>cuánto duró</td></tr><tr><td>31.50 / 33.20 min</td><td>perdidos frente a su mejor marca reciente</td></tr></tbody></table></div><figcaption>Fuente: <a href="https://doi.org/10.1371/journal.pone.0251513">Smyth 2021</a>. Datos observacionales de 270 carreras. Aquí el muro es bajar el ritmo al menos un 25% durante 5 km o más después del km 20.</figcaption></figure><figure class="rp-fig" aria-label="Salir rápido se relacionó con el muro"><h4>Salir rápido se relacionó con el muro</h4><p class="rp-sub">Porcentaje de corredores de Boston que chocó con el muro, según cómo dosificó</p><div class="rp-row"><div class="rp-lab">Salió más de un 5% rápido<small>frente a su ritmo promedio</small></div><div class="rp-track" title="Salió más de un 5% rápido: 26.6%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:26.60%;background:var(--heat)"></div><div class="rp-val" style="left:26.60%">26.6%</div></div></div><div class="rp-row"><div class="rp-lab">Salió cerca de su ritmo promedio</div><div class="rp-track" title="Salió cerca de su ritmo promedio: 1.5%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:1.50%;background:var(--pc)"></div><div class="rp-val" style="left:1.50%">1.5%</div></div></div><div class="rp-row"><div class="rp-lab">Ritmo parejo<small>47.9% de los corredores</small></div><div class="rp-track" title="Ritmo parejo: 0.2%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:0.60%;background:var(--pc)"></div><div class="rp-val" style="left:0.20%">0.2%</div></div></div><div class="rp-row"><div class="rp-lab">Ritmo variable<small>cambió de ritmo una y otra vez</small></div><div class="rp-track" title="Ritmo variable: 85.4%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:85.40%;background:var(--heat)"></div><div class="rp-val rp-left" style="left:85.40%">85.4%</div></div></div><div class="rp-axis"><span style="left:0.00%">0%</span><span style="left:25.00%"></span><span style="left:50.00%">50%</span><span style="left:75.00%"></span><span style="left:100.00%">100%</span></div><div class="rp-sr"><table><caption>Porcentaje de corredores de Boston que chocó con el muro, según cómo dosificó</caption><thead><tr><th>Ritmo</th><th>Detalle</th><th>Chocó con el muro</th></tr></thead><tbody><tr><td>Salió más de un 5% rápido</td><td>frente a su ritmo promedio</td><td>26.6%</td></tr><tr><td>Salió cerca de su ritmo promedio</td><td></td><td>1.5%</td></tr><tr><td>Ritmo parejo</td><td>47.9% de los corredores</td><td>0.2%</td></tr><tr><td>Ritmo variable</td><td>cambió de ritmo una y otra vez</td><td>85.4%</td></tr></tbody></table></div><figcaption>Fuente: <a href="https://doi.org/10.1371/journal.pone.0352808">Dong &amp; Li 2026</a>. 78,912 corredores que terminaron el Maratón de Boston, 2015 a 2017. Observacional: una relación, no una prueba. Un solo circuito en bajada neta, sin datos de clima.</figcaption></figure><figure class="rp-fig" aria-label="Más carbohidratos, más potencia tras 3 horas"><h4>Más carbohidratos, más potencia tras 3 horas</h4><p class="rp-sub">Potencia crítica después de 3 h de bici, según lo que tomaron</p><div class="rp-row"><div class="rp-lab">Descansados<small>antes de la bici</small></div><div class="rp-track" title="Descansados: 277 W"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:92.33%;background:var(--ref)"></div><div class="rp-val rp-left" style="left:92.33%">277 W</div></div></div><div class="rp-row"><div class="rp-lab">Solo agua<small>tras 3 h</small></div><div class="rp-track" title="Solo agua: 236 W"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:78.67%;background:var(--heat)"></div><div class="rp-val rp-left" style="left:78.67%">236 W</div></div></div><div class="rp-row"><div class="rp-lab">60 g/h<small>tras 3 h</small></div><div class="rp-track" title="60 g/h: 257 W"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:85.67%;background:var(--pc)"></div><div class="rp-val rp-left" style="left:85.67%">257 W</div></div></div><div class="rp-row"><div class="rp-lab">120 g/h<small>tras 3 h</small></div><div class="rp-track" title="120 g/h: 266 W"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:33.33%"></div><div class="rp-grid" style="left:66.67%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:88.67%;background:var(--pc)"></div><div class="rp-val rp-left" style="left:88.67%">266 W</div></div></div><div class="rp-axis"><span style="left:0.00%">0</span><span style="left:33.33%">100</span><span style="left:66.67%">200</span><span style="left:100.00%">300</span></div><p class="rp-axl">Vatios</p><div class="rp-sr"><table><caption>Potencia crítica después de 3 h de bici, según lo que tomaron</caption><thead><tr><th>Condición</th><th>Cuándo</th><th>Potencia crítica</th></tr></thead><tbody><tr><td>Descansados</td><td>antes de la bici</td><td>277 W</td></tr><tr><td>Solo agua</td><td>tras 3 h</td><td>236 W</td></tr><tr><td>60 g/h</td><td>tras 3 h</td><td>257 W</td></tr><tr><td>120 g/h</td><td>tras 3 h</td><td>266 W</td></tr></tbody></table></div><figcaption>Fuente: <a href="https://doi.org/10.1111/sms.70326">Norte et al. 2026</a>. Ensayo cruzado aleatorizado, 16 ciclistas y triatletas entrenados (15 hombres). Bici en laboratorio, sin tiempo de carrera.</figcaption></figure></main></body></html>
