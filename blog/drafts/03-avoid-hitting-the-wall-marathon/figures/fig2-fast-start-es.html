<style>
.rp-fig{--ink:#15171A;--muted:#5B5F64;--line:#DDD9D0;--card:#FFFFFF;--pc:#008A6C;--pc2:#DCEFE9;--heat:#B83C0B;--ref:#A4A9AE;
 position:relative;margin:32px 0;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.rp-fig *{box-sizing:border-box}
.rp-fig h4{margin:0;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:20px;line-height:1.25;letter-spacing:-0.01em}
.rp-fig .rp-sub{margin:4px 0 16px;font-size:14px;color:var(--muted)}
.rp-fig .rp-row{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:10px;align-items:center;margin:10px 0}
.rp-fig .rp-lab{font-size:14px;font-weight:600;line-height:1.25}
.rp-fig .rp-lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.rp-fig .rp-track{position:relative;height:24px}
.rp-fig .rp-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.rp-fig .rp-bar{position:absolute;top:2px;height:20px;border-radius:0 4px 4px 0}
.rp-fig .rp-val{position:absolute;top:2px;line-height:20px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--ink);white-space:nowrap;padding-left:8px}
.rp-fig .rp-val.rp-left{padding-left:0;padding-right:8px;transform:translateX(-100%);color:#FFFFFF}
.rp-fig .rp-axis{position:relative;height:18px;margin-left:calc(40% + 10px);border-top:1px solid var(--line);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted)}
.rp-fig .rp-axis span{position:absolute;top:3px;transform:translateX(-50%);white-space:nowrap}
.rp-fig .rp-axis span:last-child{transform:translateX(-100%)}
.rp-fig .rp-axl{margin:6px 0 0 calc(40% + 10px);font-size:12px;color:var(--muted)}
.rp-fig .rp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rp-fig .rp-card{background:var(--pc2);border-radius:10px;padding:14px 16px}
.rp-fig .rp-card b{display:block;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-0.02em;color:var(--pc)}
.rp-fig .rp-card span{display:block;margin-top:4px;font-size:14px;line-height:1.35;color:var(--ink)}
.rp-fig .rp-card small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.rp-fig figcaption{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--muted)}
.rp-fig figcaption a{color:var(--muted)}
.rp-fig .rp-sr{position:absolute;left:0;top:0;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
@media (max-width:480px){.rp-fig{padding:16px}.rp-fig h4{font-size:18px}.rp-fig .rp-row{grid-template-columns:132px 1fr}.rp-fig .rp-axis,.rp-fig .rp-axl{margin-left:142px}.rp-fig .rp-cards{grid-template-columns:1fr}.rp-fig .rp-card b{font-size:24px}}
</style>
<figure class="rp-fig" aria-label="Salir rápido se relacionó con el muro"><h4>Salir rápido se relacionó con el muro</h4><p class="rp-sub">Porcentaje de corredores de Boston que chocó con el muro, según cómo dosificó</p><div class="rp-row"><div class="rp-lab">Salió más de un 5% rápido<small>frente a su ritmo promedio</small></div><div class="rp-track" title="Salió más de un 5% rápido: 26.6%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:26.60%;background:var(--heat)"></div><div class="rp-val" style="left:26.60%">26.6%</div></div></div><div class="rp-row"><div class="rp-lab">Salió cerca de su ritmo promedio</div><div class="rp-track" title="Salió cerca de su ritmo promedio: 1.5%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:1.50%;background:var(--pc)"></div><div class="rp-val" style="left:1.50%">1.5%</div></div></div><div class="rp-row"><div class="rp-lab">Ritmo parejo<small>47.9% de los corredores</small></div><div class="rp-track" title="Ritmo parejo: 0.2%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:0.60%;background:var(--pc)"></div><div class="rp-val" style="left:0.20%">0.2%</div></div></div><div class="rp-row"><div class="rp-lab">Ritmo variable<small>cambió de ritmo una y otra vez</small></div><div class="rp-track" title="Ritmo variable: 85.4%"><div class="rp-grid" style="left:0.00%"></div><div class="rp-grid" style="left:25.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:75.00%"></div><div class="rp-grid" style="left:100.00%"></div><div class="rp-bar" style="left:0;width:85.40%;background:var(--heat)"></div><div class="rp-val rp-left" style="left:85.40%">85.4%</div></div></div><div class="rp-axis"><span style="left:0.00%">0%</span><span style="left:25.00%"></span><span style="left:50.00%">50%</span><span style="left:75.00%"></span><span style="left:100.00%">100%</span></div><div class="rp-sr"><table><caption>Porcentaje de corredores de Boston que chocó con el muro, según cómo dosificó</caption><thead><tr><th>Ritmo</th><th>Detalle</th><th>Chocó con el muro</th></tr></thead><tbody><tr><td>Salió más de un 5% rápido</td><td>frente a su ritmo promedio</td><td>26.6%</td></tr><tr><td>Salió cerca de su ritmo promedio</td><td></td><td>1.5%</td></tr><tr><td>Ritmo parejo</td><td>47.9% de los corredores</td><td>0.2%</td></tr><tr><td>Ritmo variable</td><td>cambió de ritmo una y otra vez</td><td>85.4%</td></tr></tbody></table></div><figcaption>Fuente: <a href="https://doi.org/10.1371/journal.pone.0352808">Dong &amp; Li 2026</a>. 78,912 corredores que terminaron el Maratón de Boston, 2015 a 2017. Observacional: una relación, no una prueba. Un solo circuito en bajada neta, sin datos de clima.</figcaption></figure>
