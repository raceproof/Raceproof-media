<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog 01 figures</title><link rel="stylesheet" href="../../../../assets/fonts/fonts.css"><style>
.rp-fig{--ink:#15171A;--muted:#5B5F64;--line:#DDD9D0;--card:#FFFFFF;--gut:#1F5FAF;--gut2:#7FA3D6;--heat:#B83C0B;--ref:#A4A9AE;
 position:relative;margin:32px 0;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.rp-fig *{box-sizing:border-box}
.rp-fig h4{margin:0;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:20px;line-height:1.25;letter-spacing:-0.01em}
.rp-fig .rp-sub{margin:4px 0 16px;font-size:14px;color:var(--muted)}
.rp-fig .rp-row{display:grid;grid-template-columns:minmax(88px,28%) 1fr;gap:10px;align-items:center;margin:10px 0}
.rp-fig .rp-lab{font-size:14px;font-weight:600;line-height:1.25}
.rp-fig .rp-lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.rp-fig .rp-track{position:relative;height:24px}
.rp-fig .rp-bar{position:absolute;top:2px;height:20px;border-radius:0 4px 4px 0}
.rp-fig .rp-bar.rp-range{border-radius:4px}
.rp-fig .rp-val{position:absolute;top:2px;line-height:20px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--ink);white-space:nowrap;padding-left:6px}
.rp-fig .rp-axis{position:relative;height:18px;margin-left:calc(28% + 10px);border-top:1px solid var(--line);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted)}
.rp-fig .rp-axis span{position:absolute;top:3px;transform:translateX(-50%)}
.rp-fig .rp-plot{position:relative}
.rp-fig .rp-ref{position:absolute;top:24px;bottom:0;border-left:2px dashed var(--muted)}
.rp-fig .rp-refl{position:absolute;top:-22px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap;background:var(--card);padding:0 4px}
.rp-fig .rp-zero{position:absolute;top:0;bottom:0;border-left:1px solid var(--muted)}
.rp-fig .rp-stats{display:flex;gap:24px;flex-wrap:wrap;margin:0 0 14px}
.rp-fig .rp-stat b{display:block;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:28px;letter-spacing:-0.02em;color:var(--ink)}
.rp-fig .rp-stat span{font-size:13px;color:var(--muted)}
.rp-fig .rp-key{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 6px}
.rp-fig .rp-key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.rp-fig figcaption{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--muted)}
.rp-fig figcaption a{color:var(--muted)}
.rp-fig .rp-sr{position:absolute;left:0;top:0;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.rp-fig .rp-in{position:absolute;top:2px;line-height:20px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;white-space:nowrap;padding-right:8px;transform:translateX(-100%)}
@media (max-width:480px){.rp-fig{padding:16px}.rp-fig h4{font-size:18px}.rp-fig .rp-row{grid-template-columns:96px 1fr}.rp-fig .rp-axis{margin-left:106px}}
</style><style>body{margin:0;background:#F4F2ED;font-family:Inter,sans-serif}main{max-width:720px;margin:0 auto;padding:24px 16px}h2{font-family:"Inter Display",Inter;margin:40px 0 0}</style></head><body><main><h2>EN</h2><figure class="rp-fig" aria-label="Your finish time sets your carb target"><h4>Your finish time sets your carb target</h4><p class="rp-sub">Guideline carbs per hour during the race, by how long you will be out there</p><div class="rp-plot" style="padding-top:30px"><div class="rp-ref" style="left:calc(28% + 10px + (100% - 28% - 10px) * 0.3500)"><span class="rp-refl">Seville average: 35 g/h</span></div><div class="rp-row"><div class="rp-lab">2 to 3 hours<small>30 to 60 g/h · one sugar is fine</small></div><div class="rp-track" title="2 to 3 hours: 30 to 60 g/h"><div class="rp-bar rp-range" style="left:30.00%;width:30.00%;background:var(--gut)"></div></div></div><div class="rp-row"><div class="rp-lab">Over 2.5 to 3 hours<small>up to 90 g/h · mixed sugars</small></div><div class="rp-track" title="Over 2.5 to 3 hours: up to 90 g/h"><div class="rp-bar rp-range" style="left:60.00%;width:30.00%;background:var(--gut)"></div></div></div></div><div class="rp-axis"><span style="left:0.00%">0</span><span style="left:30.00%">30</span><span style="left:60.00%">60</span><span style="left:90.00%">90</span></div><div class="rp-sr"><table><caption>Your finish time sets your carb target</caption><thead><tr><th>Race length</th><th>Guideline</th></tr></thead><tbody><tr><td>2 to 3 hours</td><td>30 to 60 g/h</td></tr><tr><td>Over 2.5 to 3 hours</td><td>up to 90 g/h</td></tr></tbody></table></div><figcaption>Guidelines: <a href="https://doi.org/10.1080/02640414.2011.585473">Burke et al. 2011</a>, <a href="https://doi.org/10.1007/s40279-014-0148-z">Jeukendrup 2014</a> (written at the Gatorade Sports Science Institute), <a href="https://pubmed.ncbi.nlm.nih.gov/26917108/">ADA, DC and ACSM 2016</a>. Seville average: <a href="https://doi.org/10.1186/s40798-024-00801-w">Jiménez-Alfageme et al. 2025</a>.</figcaption></figure><figure class="rp-fig" aria-label="Most marathoners under-fuel, and slower runners most"><h4>Most marathoners under-fuel, and slower runners most</h4><p class="rp-sub">Share of 2022 Seville Marathon runners taking under 30 g of carbs an hour, by finish time</p><div class="rp-stats"><div class="rp-stat"><b>35 g/h</b><span>average intake</span></div><div class="rp-stat"><b>9%</b><span>in the 60 to 90 g/h range</span></div></div><div class="rp-row"><div class="rp-lab">Under 3 h</div><div class="rp-track" title="Under 3 h: 22.2%"><div class="rp-bar" style="left:0;width:22.20%;background:var(--heat)"></div><div class="rp-val" style="left:22.20%">22.2%</div></div></div><div class="rp-row"><div class="rp-lab">3 to 4 h</div><div class="rp-track" title="3 to 4 h: 42.1%"><div class="rp-bar" style="left:0;width:42.10%;background:var(--heat)"></div><div class="rp-val" style="left:42.10%">42.1%</div></div></div><div class="rp-row"><div class="rp-lab">Over 4 h</div><div class="rp-track" title="Over 4 h: 66.7%"><div class="rp-bar" style="left:0;width:66.70%;background:var(--heat)"></div><div class="rp-val" style="left:66.70%">66.7%</div></div></div><div class="rp-axis"><span style="left:0.00%">0%</span><span style="left:25.00%">25%</span><span style="left:50.00%">50%</span><span style="left:75.00%">75%</span><span style="left:100.00%">100%</span></div><div class="rp-sr"><table><caption>Share of 2022 Seville Marathon runners taking under 30 g of carbs an hour, by finish time</caption><thead><tr><th>Finish time</th><th>Under 30 g/h</th></tr></thead><tbody><tr><td>Under 3 h</td><td>22.2%</td></tr><tr><td>3 to 4 h</td><td>42.1%</td></tr><tr><td>Over 4 h</td><td>66.7%</td></tr></tbody></table></div><figcaption><a href="https://doi.org/10.1186/s40798-024-00801-w">Jiménez-Alfageme et al. 2025</a>. Survey of 160 runners (140 men), self-reported intake. Shows what runners did, not what works.</figcaption></figure><figure class="rp-fig" aria-label="More carbs, more power left late"><h4>More carbs, more power left late</h4><p class="rp-sub">Critical power after 3 hours of moderate cycling, by carbs taken during the ride</p><div class="rp-key"><span><i style="background:var(--ref)"></i>No carbs</span><span><i style="background:var(--gut2)"></i>60 g/h</span><span><i style="background:var(--gut)"></i>120 g/h</span></div><div class="rp-plot" style="padding-top:30px"><div class="rp-ref" style="left:calc(28% + 10px + (100% - 28% - 10px) * 0.9233)"><span class="rp-refl" style="transform:translateX(-90%)">Fresh: 277 W</span></div><div class="rp-row"><div class="rp-lab">Water<small>no carbs</small></div><div class="rp-track" title="Water: 236 W"><div class="rp-bar" style="left:0;width:78.67%;background:var(--ref)"></div><div class="rp-in" style="left:78.67%;color:#15171A">236 W</div></div></div><div class="rp-row"><div class="rp-lab">60 g/h</div><div class="rp-track" title="60 g/h: 257 W"><div class="rp-bar" style="left:0;width:85.67%;background:var(--gut2)"></div><div class="rp-in" style="left:85.67%;color:#15171A">257 W</div></div></div><div class="rp-row"><div class="rp-lab">120 g/h</div><div class="rp-track" title="120 g/h: 266 W"><div class="rp-bar" style="left:0;width:88.67%;background:var(--gut)"></div><div class="rp-in" style="left:88.67%;color:#FFFFFF">266 W</div></div></div></div><div class="rp-axis"><span style="left:0.00%">0</span><span style="left:33.33%">100</span><span style="left:66.67%">200</span><span style="left:100.00%">300</span></div><div class="rp-sr"><table><caption>Critical power after 3 hours of moderate cycling, by carbs taken during the ride</caption><thead><tr><th>During the ride</th><th>Critical power after 3 h</th></tr></thead><tbody><tr><td>Water</td><td>236 W</td></tr><tr><td>60 g/h</td><td>257 W</td></tr><tr><td>120 g/h</td><td>266 W</td></tr><tr><td>Fresh</td><td>277 W</td></tr></tbody></table></div><figcaption><a href="https://doi.org/10.1111/sms.70326">Norte et al. 2026</a>. 16 trained cyclists and triathletes (15 men), lab study. Measures power, not race time.</figcaption></figure><figure class="rp-fig" aria-label="Two weeks of gut training paid off"><h4>Two weeks of gut training paid off</h4><p class="rp-sub">Change in distance on a 1-hour running test after 2 weeks of practice</p><div class="rp-key"><span><i style="background:var(--gut)"></i>Gut training</span><span><i style="background:var(--heat)"></i>Placebo</span></div><div class="rp-row"><div class="rp-lab">Carb gels<small>symptoms down 60%</small></div><div class="rp-track" title="Carb gels: +5.2%"><div class="rp-zero" style="left:33.33%"></div><div class="rp-bar" style="left:33.33%;width:43.33%;background:var(--gut)"></div><div class="rp-val" style="left:76.67%">+5.2%</div></div></div><div class="rp-row"><div class="rp-lab">Carb food<small>symptoms down 63%</small></div><div class="rp-track" title="Carb food: +4.3%"><div class="rp-zero" style="left:33.33%"></div><div class="rp-bar" style="left:33.33%;width:35.83%;background:var(--gut)"></div><div class="rp-val" style="left:69.17%">+4.3%</div></div></div><div class="rp-row"><div class="rp-lab">Placebo</div><div class="rp-track" title="Placebo: -2.1%"><div class="rp-zero" style="left:33.33%"></div><div class="rp-bar" style="left:15.83%;width:17.50%;background:var(--heat);border-radius:4px 0 0 4px"></div><div class="rp-val" style="left:33.33%">-2.1%</div></div></div><div class="rp-axis"><span style="left:0.00%">-4%</span><span style="left:33.33%">0%</span><span style="left:66.67%">+4%</span><span style="left:100.00%">+8%</span></div><div class="rp-sr"><table><caption>Change in distance on a 1-hour running test after 2 weeks of practice</caption><thead><tr><th>Group</th><th>Distance change</th></tr></thead><tbody><tr><td>Carb gels</td><td>+5.2%</td></tr><tr><td>Carb food</td><td>+4.3%</td></tr><tr><td>Placebo</td><td>-2.1%</td></tr></tbody></table></div><figcaption><a href="https://doi.org/10.1139/apnm-2016-0453">Costa et al. 2017</a>. 25 endurance runners, lab trial.</figcaption></figure><h2>ES</h2><figure class="rp-fig" aria-label="Tu tiempo final define tu meta de carbohidratos"><h4>Tu tiempo final define tu meta de carbohidratos</h4><p class="rp-sub">Carbohidratos por hora que recomiendan las guías, según cuánto tiempo vas a correr</p><div class="rp-plot" style="padding-top:30px"><div class="rp-ref" style="left:calc(28% + 10px + (100% - 28% - 10px) * 0.3500)"><span class="rp-refl">Promedio en Sevilla: 35 g/h</span></div><div class="rp-row"><div class="rp-lab">2 a 3 horas<small>30 a 60 g/h · un solo azúcar</small></div><div class="rp-track" title="2 a 3 horas: 30 a 60 g/h"><div class="rp-bar rp-range" style="left:30.00%;width:30.00%;background:var(--gut)"></div></div></div><div class="rp-row"><div class="rp-lab">Más de 2.5 a 3 h<small>hasta 90 g/h · azúcares mezclados</small></div><div class="rp-track" title="Más de 2.5 a 3 h: hasta 90 g/h"><div class="rp-bar rp-range" style="left:60.00%;width:30.00%;background:var(--gut)"></div></div></div></div><div class="rp-axis"><span style="left:0.00%">0</span><span style="left:30.00%">30</span><span style="left:60.00%">60</span><span style="left:90.00%">90</span></div><div class="rp-sr"><table><caption>Tu tiempo final define tu meta de carbohidratos</caption><thead><tr><th>Duración</th><th>Guía</th></tr></thead><tbody><tr><td>2 a 3 horas</td><td>30 a 60 g/h</td></tr><tr><td>Más de 2.5 a 3 h</td><td>hasta 90 g/h</td></tr></tbody></table></div><figcaption>Guías: <a href="https://doi.org/10.1080/02640414.2011.585473">Burke et al. 2011</a>, <a href="https://doi.org/10.1007/s40279-014-0148-z">Jeukendrup 2014</a> (escrito en el Gatorade Sports Science Institute), <a href="https://pubmed.ncbi.nlm.nih.gov/26917108/">ADA, DC y ACSM 2016</a>. Promedio en Sevilla: <a href="https://doi.org/10.1186/s40798-024-00801-w">Jiménez-Alfageme et al. 2025</a>.</figcaption></figure><figure class="rp-fig" aria-label="Casi todos comen poco, y los más lentos, menos"><h4>Casi todos comen poco, y los más lentos, menos</h4><p class="rp-sub">Corredores del Maratón de Sevilla 2022 que tomaron menos de 30 g de carbohidratos por hora, según su tiempo</p><div class="rp-stats"><div class="rp-stat"><b>35 g/h</b><span>consumo promedio</span></div><div class="rp-stat"><b>9%</b><span>entre 60 y 90 g/h</span></div></div><div class="rp-row"><div class="rp-lab">Menos de 3 h</div><div class="rp-track" title="Menos de 3 h: 22.2%"><div class="rp-bar" style="left:0;width:22.20%;background:var(--heat)"></div><div class="rp-val" style="left:22.20%">22.2%</div></div></div><div class="rp-row"><div class="rp-lab">3 a 4 h</div><div class="rp-track" title="3 a 4 h: 42.1%"><div class="rp-bar" style="left:0;width:42.10%;background:var(--heat)"></div><div class="rp-val" style="left:42.10%">42.1%</div></div></div><div class="rp-row"><div class="rp-lab">Más de 4 h</div><div class="rp-track" title="Más de 4 h: 66.7%"><div class="rp-bar" style="left:0;width:66.70%;background:var(--heat)"></div><div class="rp-val" style="left:66.70%">66.7%</div></div></div><div class="rp-axis"><span style="left:0.00%">0%</span><span style="left:25.00%">25%</span><span style="left:50.00%">50%</span><span style="left:75.00%">75%</span><span style="left:100.00%">100%</span></div><div class="rp-sr"><table><caption>Corredores del Maratón de Sevilla 2022 que tomaron menos de 30 g de carbohidratos por hora, según su tiempo</caption><thead><tr><th>Tiempo final</th><th>Menos de 30 g/h</th></tr></thead><tbody><tr><td>Menos de 3 h</td><td>22.2%</td></tr><tr><td>3 a 4 h</td><td>42.1%</td></tr><tr><td>Más de 4 h</td><td>66.7%</td></tr></tbody></table></div><figcaption><a href="https://doi.org/10.1186/s40798-024-00801-w">Jiménez-Alfageme et al. 2025</a>. Encuesta a 160 corredores (140 hombres), consumo autorreportado. Muestra lo que hicieron, no lo que funciona.</figcaption></figure><figure class="rp-fig" aria-label="Más carbohidratos, más potencia al final"><h4>Más carbohidratos, más potencia al final</h4><p class="rp-sub">Potencia crítica después de 3 horas de bici a ritmo moderado, según los carbohidratos tomados</p><div class="rp-key"><span><i style="background:var(--ref)"></i>Sin carbohidratos</span><span><i style="background:var(--gut2)"></i>60 g/h</span><span><i style="background:var(--gut)"></i>120 g/h</span></div><div class="rp-plot" style="padding-top:30px"><div class="rp-ref" style="left:calc(28% + 10px + (100% - 28% - 10px) * 0.9233)"><span class="rp-refl" style="transform:translateX(-90%)">Descansado: 277 W</span></div><div class="rp-row"><div class="rp-lab">Agua<small>sin carbohidratos</small></div><div class="rp-track" title="Agua: 236 W"><div class="rp-bar" style="left:0;width:78.67%;background:var(--ref)"></div><div class="rp-in" style="left:78.67%;color:#15171A">236 W</div></div></div><div class="rp-row"><div class="rp-lab">60 g/h</div><div class="rp-track" title="60 g/h: 257 W"><div class="rp-bar" style="left:0;width:85.67%;background:var(--gut2)"></div><div class="rp-in" style="left:85.67%;color:#15171A">257 W</div></div></div><div class="rp-row"><div class="rp-lab">120 g/h</div><div class="rp-track" title="120 g/h: 266 W"><div class="rp-bar" style="left:0;width:88.67%;background:var(--gut)"></div><div class="rp-in" style="left:88.67%;color:#FFFFFF">266 W</div></div></div></div><div class="rp-axis"><span style="left:0.00%">0</span><span style="left:33.33%">100</span><span style="left:66.67%">200</span><span style="left:100.00%">300</span></div><div class="rp-sr"><table><caption>Potencia crítica después de 3 horas de bici a ritmo moderado, según los carbohidratos tomados</caption><thead><tr><th>Durante la bici</th><th>Potencia crítica tras 3 h</th></tr></thead><tbody><tr><td>Agua</td><td>236 W</td></tr><tr><td>60 g/h</td><td>257 W</td></tr><tr><td>120 g/h</td><td>266 W</td></tr><tr><td>Descansado</td><td>277 W</td></tr></tbody></table></div><figcaption><a href="https://doi.org/10.1111/sms.70326">Norte et al. 2026</a>. 16 ciclistas y triatletas entrenados (15 hombres), estudio de laboratorio. Mide potencia, no tiempo de carrera.</figcaption></figure><figure class="rp-fig" aria-label="Dos semanas entrenando el estómago sí sirvieron"><h4>Dos semanas entrenando el estómago sí sirvieron</h4><p class="rp-sub">Cambio en la distancia de una prueba de 1 hora corriendo, tras 2 semanas de práctica</p><div class="rp-key"><span><i style="background:var(--gut)"></i>Estómago entrenado</span><span><i style="background:var(--heat)"></i>Placebo</span></div><div class="rp-row"><div class="rp-lab">Geles<small>molestias 60% menos</small></div><div class="rp-track" title="Geles: +5.2%"><div class="rp-zero" style="left:33.33%"></div><div class="rp-bar" style="left:33.33%;width:43.33%;background:var(--gut)"></div><div class="rp-val" style="left:76.67%">+5.2%</div></div></div><div class="rp-row"><div class="rp-lab">Comida<small>molestias 63% menos</small></div><div class="rp-track" title="Comida: +4.3%"><div class="rp-zero" style="left:33.33%"></div><div class="rp-bar" style="left:33.33%;width:35.83%;background:var(--gut)"></div><div class="rp-val" style="left:69.17%">+4.3%</div></div></div><div class="rp-row"><div class="rp-lab">Placebo</div><div class="rp-track" title="Placebo: -2.1%"><div class="rp-zero" style="left:33.33%"></div><div class="rp-bar" style="left:15.83%;width:17.50%;background:var(--heat);border-radius:4px 0 0 4px"></div><div class="rp-val" style="left:33.33%">-2.1%</div></div></div><div class="rp-axis"><span style="left:0.00%">-4%</span><span style="left:33.33%">0%</span><span style="left:66.67%">+4%</span><span style="left:100.00%">+8%</span></div><div class="rp-sr"><table><caption>Cambio en la distancia de una prueba de 1 hora corriendo, tras 2 semanas de práctica</caption><thead><tr><th>Grupo</th><th>Cambio de distancia</th></tr></thead><tbody><tr><td>Geles</td><td>+5.2%</td></tr><tr><td>Comida</td><td>+4.3%</td></tr><tr><td>Placebo</td><td>-2.1%</td></tr></tbody></table></div><figcaption><a href="https://doi.org/10.1139/apnm-2016-0453">Costa et al. 2017</a>. 25 corredores de resistencia, estudio de laboratorio.</figcaption></figure></main></body></html>
