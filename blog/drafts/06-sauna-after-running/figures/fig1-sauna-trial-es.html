<style>
.rp-fig{--ink:#15171A;--muted:#5B5F64;--line:#DDD9D0;--card:#FFFFFF;--heat:#B83C0B;--heat2:#FCE7DC;--ref:#A4A9AE;
 position:relative;margin:32px 0;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.rp-fig *{box-sizing:border-box}
.rp-fig h4{margin:0;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:20px;line-height:1.25;letter-spacing:-0.01em}
.rp-fig .rp-sub{margin:4px 0 16px;font-size:14px;color:var(--muted)}
.rp-fig .rp-row{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:10px;align-items:center;margin:10px 0}
.rp-fig .rp-lab{font-size:14px;font-weight:600;line-height:1.25}
.rp-fig .rp-lab small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.rp-fig .rp-track{position:relative;height:24px}
.rp-fig .rp-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.rp-fig .rp-bar{position:absolute;top:2px;height:20px;border-radius:0 4px 4px 0}
.rp-fig .rp-bar.rp-range{border-radius:4px}
.rp-fig .rp-dot{position:absolute;top:5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--heat)}
.rp-fig .rp-val{position:absolute;top:2px;line-height:20px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--ink);white-space:nowrap;padding-left:10px}
.rp-fig .rp-val.rp-left{padding-left:0;padding-right:10px;transform:translateX(-100%)}
.rp-fig .rp-axis{position:relative;height:18px;margin-left:calc(40% + 10px);border-top:1px solid var(--line);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted)}
.rp-fig .rp-axis span{position:absolute;top:3px;transform:translateX(-50%);white-space:nowrap}
.rp-fig .rp-axl{margin:6px 0 0 calc(40% + 10px);font-size:12px;color:var(--muted)}
.rp-fig .rp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rp-fig .rp-card{background:var(--heat2);border-radius:10px;padding:14px 16px}
.rp-fig .rp-card b{display:block;font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-0.02em;color:var(--heat)}
.rp-fig .rp-card span{display:block;margin-top:4px;font-size:14px;line-height:1.35;color:var(--ink)}
.rp-fig .rp-card small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.rp-fig figcaption{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--muted)}
.rp-fig figcaption a{color:var(--muted)}
.rp-fig .rp-ci{position:absolute;top:11px;height:2px;background:var(--ink)}
.rp-fig .rp-ci:before,.rp-fig .rp-ci:after{content:'';position:absolute;top:-5px;width:2px;height:12px;background:var(--ink)}
.rp-fig .rp-ci:before{left:0}.rp-fig .rp-ci:after{right:0}
.rp-fig .rp-bar.rp-muted{background:var(--ref)}
.rp-fig .rp-zero{position:absolute;top:-4px;bottom:-4px;border-left:2px solid var(--muted)}
.rp-fig .rp-sr{position:absolute;left:0;top:0;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
@media (max-width:480px){.rp-fig{padding:16px}.rp-fig h4{font-size:18px}.rp-fig .rp-row{grid-template-columns:132px 1fr}.rp-fig .rp-axis,.rp-fig .rp-axl{margin-left:142px}.rp-fig .rp-cards{grid-template-columns:1fr}.rp-fig .rp-card b{font-size:24px}}
</style>
<figure class="rp-fig" aria-label="32% más tiempo hasta el agotamiento no es 32% más rápido"><h4>32% más tiempo hasta el agotamiento no es 32% más rápido</h4><p class="rp-sub">Cambio tras 3 semanas con sauna después de entrenar vs 3 semanas sin sauna, con límites de confianza del 90%</p><div class="rp-row"><div class="rp-lab">Tiempo hasta el agotamiento<small>Medido, a ritmo de 5 km</small></div><div class="rp-track" title="Tiempo hasta el agotamiento: +32% (21 a 43%)"><div class="rp-grid" style="left:30.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:70.00%"></div><div class="rp-grid" style="left:90.00%"></div><div class="rp-zero" style="left:10.00%"></div><div class="rp-bar" style="left:10.00%;width:64.00%;background:var(--heat)"></div><div class="rp-ci" style="left:52.00%;width:44.00%"></div><div class="rp-val" style="left:10.00%;color:#FFFFFF;font-weight:600">+32%</div></div></div><div class="rp-row"><div class="rp-lab">Contrarreloj<small>Estimación de los autores, no medida</small></div><div class="rp-track" title="Contrarreloj: +1.9% (1.3 a 2.4%)"><div class="rp-grid" style="left:30.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:70.00%"></div><div class="rp-grid" style="left:90.00%"></div><div class="rp-zero" style="left:10.00%"></div><div class="rp-bar rp-muted" style="left:10.00%;width:3.80%;"></div><div class="rp-ci" style="left:12.60%;width:2.20%"></div><div class="rp-val" style="left:14.80%">+1.9%</div></div></div><div class="rp-row"><div class="rp-lab">Volumen de plasma<small>Medido</small></div><div class="rp-track" title="Volumen de plasma: +7.1% (5.6 a 8.7%)"><div class="rp-grid" style="left:30.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:70.00%"></div><div class="rp-grid" style="left:90.00%"></div><div class="rp-zero" style="left:10.00%"></div><div class="rp-bar" style="left:10.00%;width:14.20%;background:var(--heat)"></div><div class="rp-ci" style="left:21.20%;width:6.20%"></div><div class="rp-val" style="left:27.40%">+7.1%</div></div></div><div class="rp-row"><div class="rp-lab">Volumen de glóbulos rojos<small>Medido, no es claro</small></div><div class="rp-track" title="Volumen de glóbulos rojos: +3.5% (-0.8 a 8.1%)"><div class="rp-grid" style="left:30.00%"></div><div class="rp-grid" style="left:50.00%"></div><div class="rp-grid" style="left:70.00%"></div><div class="rp-grid" style="left:90.00%"></div><div class="rp-zero" style="left:10.00%"></div><div class="rp-bar" style="left:10.00%;width:7.00%;background:var(--heat)"></div><div class="rp-ci" style="left:8.40%;width:17.80%"></div><div class="rp-val" style="left:26.20%">+3.5%</div></div></div><div class="rp-axis"><span style="left:10.00%">0</span><span style="left:30.00%">+10%</span><span style="left:50.00%">+20%</span><span style="left:70.00%">+30%</span><span style="left:90.00%">+40%</span></div><p class="rp-axl">Cambio vs el bloque sin sauna</p><div class="rp-sr"><table><caption>Cambio tras 3 semanas con sauna después de entrenar vs 3 semanas sin sauna, con límites de confianza del 90%</caption><thead><tr><th>Medida</th><th>Nota</th><th>Cambio</th><th>Límites de confianza del 90%</th></tr></thead><tbody><tr><td>Tiempo hasta el agotamiento</td><td>Medido, a ritmo de 5 km</td><td>+32%</td><td>21% a 43%</td></tr><tr><td>Contrarreloj</td><td>Estimación de los autores, no medida</td><td>+1.9%</td><td>1.3% a 2.4%</td></tr><tr><td>Volumen de plasma</td><td>Medido</td><td>+7.1%</td><td>5.6% a 8.7%</td></tr><tr><td>Volumen de glóbulos rojos</td><td>Medido, no es claro</td><td>+3.5%</td><td>-0.8% a 8.1%</td></tr></tbody></table></div><figcaption><a href="https://doi.org/10.1016/j.jsams.2006.06.009">Scoon et al. 2007</a>. Ensayo cruzado, 6 corredores de fondo hombres de nivel competitivo, sauna húmedo a cerca de 90°C durante unos 31 min después de entrenar, 12.7 sesiones en promedio. Prueba 1 a 2 días después de cada bloque.</figcaption></figure>
