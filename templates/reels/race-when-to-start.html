<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Race breakdown reel: when to start</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<!-- Race breakdown Wednesday Reel. Hook (the race's queue-row hook) and key numbers first, then the
     "When to start" adaptation timeline counted back from race day. Ends on a still CTA; the standard
     end card (assets/video/endcard/raceproof-endcard-en|es.mp4) is crossfaded on after render.
     Change only the DATA block. Built from adaptation-timeline.html (same specs: 1080 x 1920, 30 fps,
     text inside y 220 to 1500, ease-out motion of 300 ms or more, hook in the first second). -->
<style>
  html,body{margin:0;background:#F4F2ED}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F4F2ED;color:#15171A;font-family:"Inter",sans-serif}
  .disp{font-family:"Inter Display","Inter",sans-serif;font-weight:800;letter-spacing:-0.02em}
  .mono{font-family:"JetBrains Mono",monospace}
  .abs{position:absolute}
  #kicker{left:60px;top:250px;font-size:28px;letter-spacing:0.08em;color:#B83C0B}
  #hook{left:60px;top:310px;width:960px;font-size:72px;line-height:80px}
  #hook .hl{color:#B83C0B}
  #nums{left:60px;top:640px;width:960px;display:flex;flex-wrap:wrap;gap:20px}
  #nums .n{background:#FFFFFF;border:1px solid #DDD9D0;border-radius:10px;padding:22px 28px;display:flex;flex-direction:column;gap:6px;min-width:400px;box-sizing:border-box}
  #nums .n .l{font-size:22px;letter-spacing:0.08em;color:#5B5F64}
  #nums .n .v{font-size:52px;line-height:58px;font-weight:600;letter-spacing:-0.02em}
  #head{left:60px;top:250px;width:960px}
  #head .t{font-size:76px;line-height:82px}
  #head .s{font-size:30px;color:#5B5F64;margin-top:14px}
  #close{left:60px;top:250px;width:960px;opacity:0}
  #close .t{font-size:66px;line-height:74px}
  #close .s{font-size:30px;color:#5B5F64;margin-top:14px}
  .axis{top:560px;font-size:24px;color:#5B5F64;transform:translateX(-50%);white-space:nowrap}
  .grid{top:598px;width:2px;height:820px;background:#E3DFD6;transform-origin:top}
  #race{left:1018px;top:590px;width:0;height:830px;border-left:3px dashed #5B5F64;transform-origin:top}
  .row{left:60px;width:960px;height:160px}
  .row .name{position:absolute;left:0;top:0;font-size:38px;font-weight:600;line-height:44px}
  .row .track{position:absolute;left:0;top:54px;width:960px;height:30px;border-radius:4px;background:#E6E2DA}
  .row .band{position:absolute;top:0;height:30px;border-radius:4px;transform-origin:left}
  .row .note{position:absolute;left:0;top:96px;font-size:28px;line-height:34px;color:#5B5F64;white-space:nowrap}
  #logoStill{left:60px;top:176px;height:44px;display:none}
</style>
</head>
<body>
<div id="stage">
  <img id="logoStill" class="abs" src="../../assets/brand/lockup.png" alt="">
  <div id="hookWrap">
    <div id="kicker" class="abs mono"></div>
    <div id="hook" class="abs disp"></div>
    <div id="nums" class="abs"></div>
  </div>
  <div id="head" class="abs"><div class="t disp"></div><div class="s mono"></div></div>
  <div id="close" class="abs"><div class="t disp"></div><div class="s"></div></div>
  <div id="axes"></div>
  <div id="race" class="abs"></div>
  <div id="rows"></div>
</div>
<script>
// ===== DATA (change only this block) =====
const DATA = {
  kicker: 'RACE BREAKDOWN · BLACK CANYON 100K',
  hook: 'In 2024, overnight snow delayed the desert start to <span class="hl">9:30 am</span>.',
  nums: [['DISTANCE','100.1 km'],['TYPICAL HIGH','17.2°C'],['GAIN','1,591 m'],['LOSS','2,236 m']],
  head: 'When to start',
  headSub: 'RACE DAY FEB 13, 2027 · 15 WEEKS FROM OCT 28',
  rows: [
    { name:'Climbing', c:'#A87408', note:'All block. 16 weeks out was Oct 24.',        bands:[['build',16,0]] },
    { name:'Gut',      c:'#1F5FAF', note:'Start Nov 21. Race carbs by Jan 16.',         bands:[['build',12,4],['keep',4,0]] },
    { name:'Downhill', c:'#A23B72', note:'Biggest weeks Jan 9 to 23. Last by Feb 3.',    bands:[['build',12,1.5]] },
    { name:'Pacing',   c:'#008A6C', note:'Goal-pace work from Dec 5.',                  bands:[['build',10,0]] },
    { name:'Taper',    c:'#7A4BB0', note:'Final 3 weeks, from Jan 23.',                 bands:[['build',3,0]] }
  ],
  close: 'Full breakdown on raceproof.ai',
  closeSub: 'General guidelines, not a prescription.'
};
// ===== END DATA =====

const X = w => 60 + (16 - w) * 60;              // weeks out -> x (16 weeks out at left, race at right)
const ROW_TOP = 620, ROW_H = 160;
const q = s => document.querySelector(s);
q('#kicker').textContent = DATA.kicker;
q('#hook').innerHTML = DATA.hook;
q('#nums').innerHTML = DATA.nums.map(n => `<div class="n"><span class="l mono">${n[0]}</span><span class="v mono">${n[1]}</span></div>`).join('');
q('#head .t').textContent = DATA.head; q('#head .s').textContent = DATA.headSub;
q('#close .t').textContent = DATA.close; q('#close .s').textContent = DATA.closeSub;

const axes = q('#axes');
[16, 12, 8, 4, 0].forEach((w, i) => {
  const l = document.createElement('div');
  l.className = 'abs mono axis'; l.style.left = X(w) + 'px';
  l.textContent = i === 0 ? '16 WKS' : (w === 0 ? 'RACE' : String(w));
  if (i === 0) { l.style.transform = 'none'; l.style.left = '60px'; }
  if (w === 0) { l.style.transform = 'translateX(-100%)'; l.style.left = '1020px'; }
  axes.appendChild(l);
  if (w > 0 && i > 0) { const g = document.createElement('div'); g.className = 'abs grid'; g.style.left = (X(w) - 1) + 'px'; axes.appendChild(g); }
});

const rowEls = DATA.rows.map((R, i) => {
  const r = document.createElement('div');
  r.className = 'abs row'; r.style.top = (ROW_TOP + i * ROW_H) + 'px';
  r.innerHTML = `<div class="name">${R.name}</div><div class="track"></div><div class="note">${R.note}</div>`;
  const track = r.querySelector('.track');
  const parts = R.bands.map(b => {
    const e = document.createElement('div');
    e.className = 'band'; e.style.left = (X(b[1]) - 60) + 'px'; e.style.width = (X(b[2]) - X(b[1])) + 'px';
    e.style.background = R.c; if (b[0] === 'keep') e.style.opacity = 0.35;
    track.appendChild(e); return { kind: b[0], el: e };
  });
  q('#rows').appendChild(r);
  return { row: r, name: r.querySelector('.name'), track, note: r.querySelector('.note'), parts };
});

const clamp = v => Math.max(0, Math.min(1, v));
const ease = v => 1 - Math.pow(1 - clamp(v), 3);
const prog = (t, a, d) => ease((t - a) / d);
const fadeUp = (el, p, dy = 20) => { el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; };

// timing (seconds). Chart is complete and still from about 9.4 s to 12.6 s, then the close holds to the end.
const HOOK_OUT = 3.6, CHART_IN = 3.9, ROW_START = [4.6, 5.5, 6.4, 7.3, 8.2], CLOSE_AT = 12.6;
window.DURATION = 15.4;

window.render = function (t) {
  const hout = prog(t, HOOK_OUT, 0.4);
  fadeUp(q('#kicker'), prog(t, 0, 0.35) * (1 - hout), 16);
  fadeUp(q('#hook'), prog(t, 0.1, 0.45) * (1 - hout), 24);
  q('#nums').querySelectorAll('.n').forEach((n, i) => fadeUp(n, prog(t, 1.1 + i * 0.3, 0.4) * (1 - hout), 16));
  const hdIn = prog(t, CHART_IN, 0.45), hdOut = prog(t, CLOSE_AT, 0.4);
  fadeUp(q('#head'), hdIn * (1 - hdOut), 20);
  document.querySelectorAll('.axis').forEach(a => a.style.opacity = prog(t, CHART_IN + 0.2, 0.4));
  document.querySelectorAll('.grid').forEach(g => g.style.transform = `scaleY(${prog(t, CHART_IN + 0.2, 0.6)})`);
  q('#race').style.transform = `scaleY(${prog(t, CHART_IN + 0.3, 0.6)})`;
  rowEls.forEach((r, i) => {
    const s = ROW_START[i];
    fadeUp(r.name, prog(t, s, 0.35), 16);
    r.track.style.opacity = prog(t, s, 0.35);
    r.parts.forEach(p => {
      if (p.kind === 'build') p.el.style.transform = `scaleX(${prog(t, s + 0.15, 0.6)})`;
      else p.el.style.transform = `scaleX(${prog(t, s + 0.65, 0.4)})`;
    });
    fadeUp(r.note, prog(t, s + 0.45, 0.4), 10);
  });
  fadeUp(q('#close'), prog(t, CLOSE_AT + 0.4, 0.5));
};

const P = new URLSearchParams(location.search);
if (P.get('still')) q('#logoStill').style.display = 'block';
render(parseFloat(P.get('t') || '0'));
</script>
</body>
</html>
