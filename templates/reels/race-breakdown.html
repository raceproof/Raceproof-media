<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Race breakdown reel</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<!-- Race breakdown Wednesday Reel (v2, replaces race-when-to-start.html).
     Scenes: (A) intro, fully drawn at frame 0: eyebrow, race name, date; then the race's hook and its 4 key numbers.
     (B) "When to start": the pillars come in one at a time, large, then hold as a full stack (3 s or more).
     (C) Key pillar deep dive 1: the race's demand for that variable (course profile + per-km ratio + key sessions).
     (D) Key pillar deep dive 2: the build-toward number and the weekly ramp, from the Adaptation rates tab.
     The standard end card (assets/video/endcard/raceproof-endcard-en|es.mp4) is crossfaded on after render.
     Change only the DATA block. Specs: 1080 x 1920, 30 fps, text inside y 220 to 1500, ease-out motion of
     300 ms or more, never a blank first frame. -->
<style>
  html,body{margin:0;background:#F4F2ED}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F4F2ED;color:#15171A;font-family:"Inter",sans-serif}
  .disp{font-family:"Inter Display","Inter",sans-serif;font-weight:800;letter-spacing:-0.02em}
  .mono{font-family:"JetBrains Mono",monospace}
  .abs{position:absolute}
  .scene{position:absolute;inset:0}
  .eyebrow{font-size:28px;letter-spacing:0.08em}
  /* A */
  #aEye{left:60px;top:250px;color:#B83C0B}
  #aName{left:60px;top:300px;width:960px;font-size:104px;line-height:108px}
  #aDate{left:60px;top:430px;font-size:30px;color:#5B5F64}
  #aHook{left:60px;top:540px;width:960px;font-size:62px;line-height:70px}
  #aHook .hl{color:#B83C0B}
  #aNums{left:60px;top:860px;width:960px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .n{background:#FFFFFF;border:1px solid #DDD9D0;border-radius:10px;padding:28px 32px;display:flex;flex-direction:column;gap:8px}
  .n .l{font-size:24px;letter-spacing:0.08em;color:#5B5F64}
  .n .v{font-size:64px;line-height:70px;font-weight:600;letter-spacing:-0.02em}
  .n .s{font-size:24px;color:#5B5F64}
  /* B */
  #bHead{left:60px;top:250px;width:960px}
  #bHead .t{font-size:80px;line-height:86px}
  #bHead .s{font-size:28px;color:#5B5F64;margin-top:12px}
  .axis{top:430px;font-size:26px;color:#5B5F64;transform:translateX(-50%);white-space:nowrap}
  .grid{top:470px;width:2px;height:1020px;background:#E3DFD6;transform-origin:top}
  #race{left:1018px;top:465px;width:0;height:1030px;border-left:3px dashed #5B5F64;transform-origin:top}
  .row{left:60px;width:960px;height:205px}
  .row .name{position:absolute;left:0;top:0;font-size:48px;font-weight:700;line-height:54px}
  .row .track{position:absolute;left:0;top:66px;width:960px;height:42px;border-radius:5px;background:#E6E2DA}
  .row .band{position:absolute;top:0;height:42px;border-radius:5px;transform-origin:left}
  .row .hl{position:absolute;left:-24px;top:-22px;width:1008px;height:198px;border-radius:12px;background:#FFFFFF;box-sizing:border-box;border:3px solid;opacity:0;z-index:0}
  .row .name,.row .track,.row .note,.row .tag{z-index:1}
  .row .tag{position:absolute;right:0;top:6px;font-size:24px;letter-spacing:0.08em;opacity:0}
  .row .note{position:absolute;left:0;top:122px;font-size:32px;line-height:38px;color:#5B5F64;white-space:nowrap}
  /* C */
  #cEye{left:60px;top:250px}
  #cHead{left:60px;top:300px;width:960px;font-size:76px;line-height:82px}
  #cChart{left:60px;top:520px;width:960px;height:420px;background:#FFFFFF;border:1px solid #DDD9D0;border-radius:10px;box-sizing:border-box}
  #cRows{left:60px;top:990px;width:960px;display:flex;flex-direction:column}
  .kv{display:flex;flex-direction:column;gap:6px;padding:24px 0;border-top:1px solid #DDD9D0}
  .kv .l{font-size:24px;letter-spacing:0.08em;color:#5B5F64}
  .kv .v{font-size:44px;line-height:52px;font-weight:700}
  .kv .s{font-size:30px;line-height:38px;color:#5B5F64}
  /* D */
  #dEye{left:60px;top:250px}
  #dHead{left:60px;top:300px;width:960px;font-size:76px;line-height:82px}
  #dChart{left:60px;top:500px;width:960px;height:640px;background:#FFFFFF;border:1px solid #DDD9D0;border-radius:10px;box-sizing:border-box}
  #dNotes{left:60px;top:1170px;width:960px;display:flex;flex-direction:column;gap:14px}
  #dNotes .a{font-size:32px;line-height:40px}
  #dNotes .b{font-size:26px;line-height:34px;color:#5B5F64}
  /* close */
  #close{left:60px;top:250px;width:960px}
  #close .t{font-size:66px;line-height:74px}
  #close .s{font-size:30px;color:#5B5F64;margin-top:14px}
  #logoStill{left:60px;top:170px;height:44px;display:none}
</style>
</head>

],[89.7,716],[90.3,703],[90.7,712],[91.3,732],[91.7,718],[92.3,694],[92.7,677],[93.3,650],[93.7,634],[94.3,622],[94.7,617],[95.3,611],[95.7,604],[96.3,595],[96.7,590],[97.3,584],[97.7,581],[98.3,579],[98.7,578],[99.3,576],[99.7,574],[100.1,571]];

    shade: [[0, 31.2]],                 // km ranges to label on the profile
    rows: [
      ['LONG RUNS', 'About 22 m down per km', 'A 30 km long run: about 670 m of descent'],

    ]
  },

<script>
const q = s => document.querySelector(s);
const clamp = v => Math.max(0, Math.min(1, v));
const ease = v => 1 - Math.pow(1 - clamp(v), 3);
const prog = (t, a, d) => ease((t - a) / d);
const fadeUp = (el, p, dy = 20) => { el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; };
const SVG = 'http://www.w3.org/2000/svg';

// ---- A
q('#aEye').textContent = DATA.eyebrow; q('#aName').textContent = DATA.name; q('#aDate').textContent = DATA.date;
q('#aHook').innerHTML = DATA.hook;
q('#aNums').innerHTML = DATA.nums.map(n => `<div class="n"><span class="l mono">${n[0]}</span><span class="v mono">${n[1]}</span><span class="s mono">${n[2] || ''}</span></div>`).join('');

// ---- B
q('#bHead .t').textContent = DATA.windowsHead; q('#bHead .s').textContent = DATA.windowsSub;
const X = w => 60 + (16 - w) * 60;
[16, 12, 8, 4, 0].forEach((w, i) => {
  const l = document.createElement('div'); l.className = 'abs mono axis'; l.style.left = X(w) + 'px';
  l.textContent = i === 0 ? '16 WKS' : (w === 0 ? 'RACE' : String(w));
  if (i === 0) { l.style.transform = 'none'; l.style.left = '60px'; }
  if (w === 0) { l.style.transform = 'translateX(-100%)'; l.style.left = '1020px'; }
  q('#axes').appendChild(l);
  if (w > 0 && i > 0) { const g = document.createElement('div'); g.className = 'abs grid'; g.style.left = (X(w) - 1) + 'px'; q('#axes').appendChild(g); }
});
const ROW_TOP = 480, ROW_H = 205;
const rowEls = DATA.rows.map((R, i) => {
  const r = document.createElement('div'); r.className = 'abs row'; r.style.top = (ROW_TOP + i * ROW_H) + 'px';
  r.innerHTML = `<div class="hl" style="border-color:${R.c}"></div><div class="tag mono" style="color:${R.c}">${DATA.keyTag}</div><div class="name">${R.name}</div><div class="track"></div><div class="note">${R.note}</div>`;
  const track = r.querySelector('.track');
  const parts = R.bands.map(b => {
    const e = document.createElement('div'); e.className = 'band';
    e.style.left = (X(b[1]) - 60) + 'px'; e.style.width = (X(b[2]) - X(b[1])) + 'px';
    e.style.background = R.c; e.style.opacity = b[0] === 'keep' ? 0.35 : (b[0] === 'peak' ? 1 : (R.bands.some(x => x[0] === 'peak') ? 0.55 : 1));
    track.appendChild(e); return { kind: b[0], el: e, base: parseFloat(e.style.opacity) };
  });
  q('#rows').appendChild(r);
  return { row: r, hl: r.querySelector('.hl'), tag: r.querySelector('.tag'), name: r.querySelector('.name'), track, note: r.querySelector('.note'), parts };
});

// ---- C: profile chart
const K = DATA.key;
q('#cEye').textContent = K.eyebrow; q('#cEye').style.color = K.c; q('#cHead').innerHTML = K.head;
(function () {
  const W = 960, H = 420, pl = 70, pr = 30, pt = 60, pb = 60;
  const P = K.profile, km = P.map(p => p[0]), m = P.map(p => p[1]);
  const kmax = km[km.length - 1], mmin = Math.floor(Math.min(...m) / 100) * 100, mmax = Math.ceil(Math.max(...m) / 100) * 100;
  const x = v => pl + (v / kmax) * (W - pl - pr), y = v => pt + (1 - (v - mmin) / (mmax - mmin)) * (H - pt - pb);
  const s = document.createElementNS(SVG, 'svg'); s.setAttribute('width', W); s.setAttribute('height', H); s.style.position = 'absolute'; s.style.left = '-1px'; s.style.top = '-1px';
  let area = `M${x(0)},${y(mmin)} ` + P.map(p => `L${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ') + ` L${x(kmax)},${y(mmin)} Z`;
  let html = '';
  K.shade.forEach(([a, b]) => { html += `<rect x="${x(a)}" y="${pt - 20}" width="${x(b) - x(a)}" height="${H - pt - pb + 20}" fill="${K.c}" opacity="0.10"/>`; });
  html += `<path d="${area}" fill="#ECE9E2"/>`;
  // descending segments in the pillar colour, climbing in ink
  for (let i = 0; i < P.length - 1; i++) {
    const down = P[i + 1][1] < P[i][1];
    html += `<line class="seg" x1="${x(P[i][0]).toFixed(1)}" y1="${y(P[i][1]).toFixed(1)}" x2="${x(P[i + 1][0]).toFixed(1)}" y2="${y(P[i + 1][1]).toFixed(1)}" stroke="${down ? K.c : '#1F2328'}" stroke-width="${down ? 6 : 4}" stroke-linecap="round" data-i="${i}"/>`;
  }
  html += `<text x="${pl - 12}" y="${y(mmax) + 8}" text-anchor="end" font-family="JetBrains Mono" font-size="20" fill="#5B5F64">${mmax}</text>`;
  html += `<text x="${pl - 12}" y="${y(mmin) + 8}" text-anchor="end" font-family="JetBrains Mono" font-size="20" fill="#5B5F64">${mmin}</text>`;
  html += `<text x="${pl - 12}" y="${pt - 28}" text-anchor="end" font-family="JetBrains Mono" font-size="20" fill="#5B5F64">m</text>`;
  [0, 25, 50, 75, 100].forEach(k => { if (k <= kmax) html += `<text x="${x(k)}" y="${H - 22}" text-anchor="middle" font-family="JetBrains Mono" font-size="20" fill="#5B5F64">${k === 0 ? '0 KM' : k}</text>`; });
  html += `<text id="cNote" x="${x(K.shade[0][0]) + 10}" y="${pt - 28}" font-family="Inter" font-size="24" font-weight="600" fill="${K.c}">${K.profileNote}</text>`;
  html += `<rect x="${W - pr - 230}" y="${pt - 44}" width="22" height="6" fill="${K.c}"/><text x="${W - pr - 200}" y="${pt - 34}" font-family="JetBrains Mono" font-size="20" fill="#5B5F64">down</text>`;
  html += `<rect x="${W - pr - 120}" y="${pt - 44}" width="22" height="6" fill="#1F2328"/><text x="${W - pr - 90}" y="${pt - 34}" font-family="JetBrains Mono" font-size="20" fill="#5B5F64">up</text>`;
  s.innerHTML = html; q('#cChart').appendChild(s);
})();
q('#cRows').innerHTML = K.rows.map(r => `<div class="kv"><span class="l mono">${r[0]}</span><span class="v">${r[1]}</span><span class="s">${r[2]}</span></div>`).join('');

// ---- D: weekly ramp bars
const R = DATA.ramp;
q('#dEye').textContent = R.eyebrow; q('#dEye').style.color = K.c; q('#dHead').innerHTML = R.head;
(function () {
  const W = 960, H = 640, pl = 40, pr = 40, pt = 110, pb = 70;
  const vmax = Math.max(R.target[0], ...R.weeks.map(w => w[1])) * 1.05;
  const n = R.weeks.length, slot = (W - pl - pr) / n, bw = slot * 0.62;
  const y = v => pt + (1 - v / vmax) * (H - pt - pb);
  let html = `<line x1="${pl}" x2="${W - pr}" y1="${y(R.target[0])}" y2="${y(R.target[0])}" stroke="#1F2328" stroke-width="3" stroke-dasharray="10 8"/>`;
  html += `<text x="${W - pr}" y="${y(R.target[0]) - 18}" text-anchor="end" font-family="JetBrains Mono" font-size="26" font-weight="600" fill="#15171A">${R.target[0].toLocaleString('en-US')} ${R.unit}</text>`;
  html += `<text x="${pl}" y="${y(R.target[0]) - 18}" font-family="Inter" font-size="24" fill="#5B5F64">${R.target[1]}</text>`;
  html += `<text x="${pl}" y="40" font-family="JetBrains Mono" font-size="20" fill="#5B5F64">${R.axisLabel}</text>`;
  R.weeks.forEach((w, i) => {
    const cx = pl + slot * i + slot / 2, h = y(0) - y(w[1]), light = w[2] === 'light';
    html += `<rect class="bar" data-i="${i}" x="${cx - bw / 2}" y="${y(w[1])}" width="${bw}" height="${h}" rx="5" fill="${K.c}" opacity="${light ? 0.4 : 1}" style="transform-origin:${cx}px ${y(0)}px"/>`;
    html += `<text class="bv" data-i="${i}" x="${cx}" y="${y(w[1]) - 12}" text-anchor="middle" font-family="JetBrains Mono" font-size="${light ? 20 : 22}" fill="${light ? '#5B5F64' : '#15171A'}">${light ? 'lighter' : w[1].toLocaleString('en-US')}</text>`;
    html += `<text x="${cx}" y="${H - 30}" text-anchor="middle" font-family="JetBrains Mono" font-size="20" fill="#5B5F64">${w[0]}</text>`;
  });
  const s = document.createElementNS(SVG, 'svg'); s.setAttribute('width', W); s.setAttribute('height', H); s.style.position = 'absolute'; s.style.left = '-1px'; s.style.top = '-1px';
  s.innerHTML = html; q('#dChart').appendChild(s);
})();
q('#dNotes').innerHTML = `<div class="a">${R.a}</div><div class="b">${R.b}</div>`;
q('#close .t').textContent = DATA.close; q('#close .s').textContent = DATA.closeSub;

// ---- timing (seconds)
const T = { aOut: 3.7, bIn: 4.0, rows: [4.6, 5.6, 6.6, 7.6, 8.6], sel: 11.3, bOut: 12.45, cIn: 12.7, cOut: 18.5, dIn: 18.8, dOut: 25.5, eIn: 25.8 };
window.DURATION = 27.5;
const segs = [...document.querySelectorAll('#cChart .seg')], bars = [...document.querySelectorAll('#dChart .bar')], bvs = [...document.querySelectorAll('#dChart .bv')];

window.render = function (t) {
  // A: name, eyebrow, date fully drawn at t = 0
  const aOut = prog(t, T.aOut, 0.35);
  q('#A').style.opacity = 1 - aOut;
  fadeUp(q('#aHook'), prog(t, 0.35, 0.45), 24);
  q('#aNums').querySelectorAll('.n').forEach((n, i) => fadeUp(n, prog(t, 0.75 + i * 0.25, 0.4), 18));
  // B
  const bIn = prog(t, T.bIn, 0.4), bOut = prog(t, T.bOut, 0.25);
  q('#B').style.opacity = bIn * (1 - bOut);
  fadeUp(q('#bHead'), bIn, 20);
  document.querySelectorAll('.axis').forEach(a => a.style.opacity = prog(t, T.bIn + 0.2, 0.4));
  document.querySelectorAll('.grid').forEach(g => g.style.transform = `scaleY(${prog(t, T.bIn + 0.2, 0.6)})`);
  q('#race').style.transform = `scaleY(${prog(t, T.bIn + 0.3, 0.6)})`;
  rowEls.forEach((r, i) => {
    const s = T.rows[i];
    fadeUp(r.name, prog(t, s, 0.35), 24);
    r.track.style.opacity = prog(t, s, 0.35);
    r.parts.forEach(p => {
      p.el.style.transform = `scaleX(${p.kind === 'keep' ? prog(t, s + 0.55, 0.4) : prog(t, s + 0.15, 0.6)})`;
    });
    fadeUp(r.note, prog(t, s + 0.4, 0.4), 12);
    // select the key pillar: others dim, key row lifts onto a card, then rises toward the next scene
    const sel = prog(t, T.sel, 0.5), rise = prog(t, T.sel + 0.6, 0.6);
    if (i === DATA.keyRow) {
      r.hl.style.opacity = sel; r.tag.style.opacity = prog(t, T.sel + 0.2, 0.35);
      const top = ROW_TOP + i * ROW_H, to = 270;
      r.row.style.transform = `translateY(${(to - top) * rise}px) scale(${1 + 0.04 * sel})`;
      r.row.style.transformOrigin = '480px top';   // scale about the frame's centre so the card stays inside 1080 px
    } else {
      r.row.style.opacity = (1 - 0.88 * sel) * (1 - rise);
    }
  });
  const dimB = (1 - 0.88 * prog(t, T.sel, 0.5)) * (1 - prog(t, T.sel + 0.6, 0.5));
  q('#bHead').style.opacity = bIn * dimB;
  document.querySelectorAll('.axis').forEach(a => a.style.opacity = prog(t, T.bIn + 0.2, 0.4) * dimB);
  document.querySelectorAll('.grid').forEach(g => g.style.opacity = dimB);
  q('#race').style.opacity = dimB;
  // C
  const cIn = prog(t, T.cIn, 0.4), cOut = prog(t, T.cOut, 0.35);
  q('#C').style.opacity = cIn * (1 - cOut);
  fadeUp(q('#cHead'), cIn, 20);
  const draw = prog(t, T.cIn + 0.3, 1.6);
  segs.forEach((s, i) => s.style.opacity = i / segs.length <= draw ? 1 : 0);
  q('#cNote').style.opacity = prog(t, T.cIn + 1.4, 0.4);
  q('#cRows').querySelectorAll('.kv').forEach((k, i) => fadeUp(k, prog(t, T.cIn + 1.6 + i * 0.6, 0.4), 14));
  // D
  const dIn = prog(t, T.dIn, 0.4), dOut = prog(t, T.dOut, 0.35);
  q('#D').style.opacity = dIn * (1 - dOut);
  fadeUp(q('#dHead'), dIn, 20);
  bars.forEach((b, i) => { const p = prog(t, T.dIn + 0.4 + i * 0.22, 0.4); b.style.transform = `scaleY(${p})`; bvs[i].style.opacity = p; });
  q('#dNotes').querySelectorAll('div').forEach((d, i) => fadeUp(d, prog(t, T.dIn + 2.4 + i * 0.5, 0.4), 12));
  // E
  const eIn = prog(t, T.eIn, 0.45);
  q('#E').style.opacity = eIn; fadeUp(q('#close'), eIn, 20);
};
const P = new URLSearchParams(location.search);
if (P.get('still')) q('#logoStill').style.display = 'block';
render(parseFloat(P.get('t') || '0'));
</script>
