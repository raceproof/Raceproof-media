<!doctype html>
<html lang="en">
<head>

<title>tue-pro-jornet-3</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>

h1,h2{text-wrap:balance}p,div,span{text-wrap:pretty}

<body>
<div style="width:1080px;height:1350px;box-sizing:border-box;padding:72px 72px 64px;background:#F4F2ED;color:#15171A;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column">

<div style="margin-top:auto;display:flex;flex-direction:column;gap:40px">
<div class="lab" style="color:#B83C0B">FINDING 1 · ENERGY</div>

<div style="background:#FFFFFF;border:1px solid #DDD9D0;border-radius:10px;padding:40px;display:flex;flex-direction:column;gap:40px">
<div style="display:flex;flex-direction:column;gap:14px">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:24px"><span style="font-size:30px;line-height:38px;font-weight:600">Burned</span><span class="mono" style="font-size:44px;font-weight:600;color:#B83C0B;white-space:nowrap">16,104 kcal</span></div>

<div style="display:flex;justify-content:space-between;align-items:baseline;gap:24px"><span style="font-size:30px;line-height:38px;font-weight:600">Ate</span><span class="mono" style="font-size:44px;font-weight:600;color:#15171A;white-space:nowrap">6,720 kcal</span></div>
<div style="height:40px;border-radius:4px;background:#ECE9E2"><div style="width:41.7%;min-width:8px;height:40px;border-radius:4px;background:#1F2328"></div></div>

</div>
<div style="margin-top:auto;padding-top:40px;display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:20px;color:#5B5F64">
<span></span>
<span style="color:#15171A">raceproof.ai</span>
