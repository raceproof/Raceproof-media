<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mon-race-tokyo-marathon-1</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
body{margin:0}
h1,h2{text-wrap:balance}p,div,span{text-wrap:pretty}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.k{display:flex;flex-direction:column;gap:6px;padding:22px 0;border-top:1px solid #DDD9D0}
.k .l{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:18px;letter-spacing:0.08em;color:#5B5F64}
.k .v{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:46px;line-height:52px;font-weight:600;letter-spacing:-0.02em}
</style>
</head>
<body>
<div style="width:1080px;height:1350px;box-sizing:border-box;padding:72px 72px 64px;background:#F4F2ED;color:#15171A;font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <img src="../../assets/brand/lockup.png" alt="raceproof" style="width:230px;height:53px;display:block">
    <span class="mono" style="font-size:20px;color:#5B5F64">MAR 7, 2027</span>
  </div>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:30px">
    <div class="mono" style="font-size:22px;font-weight:500;letter-spacing:0.08em;color:#B83C0B">RACE BREAKDOWN · TOKYO MARATHON</div>
    <h1 style="margin:0;font-size:80px;line-height:86px;font-weight:800;letter-spacing:-0.03em">Tokyo started at 4.7°C in 2024 and hit <span style="color:#B83C0B">20.6°C</span> in 2025.</h1>
    <!-- temperature scale 0 to 25 C -->
    <div style="background:#FFFFFF;border:1px solid #DDD9D0;border-radius:10px;padding:34px 40px 30px">
      <div style="position:relative;height:150px">
        <div style="position:absolute;left:0;right:0;top:70px;height:14px;border-radius:7px;background:#ECE9E2"></div>
        <!-- 4.7 -->
        <div style="position:absolute;left:calc(4.7/25*100%);top:56px;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:#1F2328"></div>
        <div class="mono" style="position:absolute;left:calc(4.7/25*100%);top:0;transform:translateX(-30%);font-size:24px;font-weight:600;white-space:nowrap">4.7°C <span style="color:#5B5F64;font-weight:400">2024 start</span></div>
        <!-- typical high 15.4 -->
        <div style="position:absolute;left:calc(15.4/25*100%);top:48px;height:58px;border-left:3px dashed #5B5F64"></div>
        <div class="mono" style="position:absolute;left:calc(15.4/25*100%);top:116px;transform:translateX(-50%);font-size:22px;color:#5B5F64;white-space:nowrap">typical high 15.4°C</div>
        <!-- 20.6 -->
        <div style="position:absolute;left:calc(20.6/25*100%);top:56px;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:#B83C0B"></div>
        <div class="mono" style="position:absolute;left:calc(20.6/25*100%);top:0;transform:translateX(-70%);font-size:24px;font-weight:600;color:#B83C0B;white-space:nowrap">20.6°C <span style="color:#5B5F64;font-weight:400">2025</span></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;column-gap:48px">
      <div class="k"><span class="l">DISTANCE</span><span class="v">42.195 km</span></div>
      <div class="k"><span class="l">TYPICAL HIGH</span><span class="v">15.4°C</span></div>
      <div class="k"><span class="l">GAIN</span><span class="v">150 m</span></div>
      <div class="k"><span class="l">LOSS</span><span class="v">180 m</span></div>
    </div>
  </div>
  <div style="margin-top:auto;padding-top:36px;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:30px;font-weight:600">Full breakdown on raceproof.ai</span>
    <span class="mono" style="font-size:18px;color:#5B5F64">Not affiliated with the race</span>
  </div>
</div>
</body>
</html>
